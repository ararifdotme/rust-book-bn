type = "Tracing"
prompt.program = """
trait MakeNoise {
  fn make_noise(&self) {
    println!("(silence)");
  }
}

struct Dog {}
struct Cat {}

impl MakeNoise for Dog {
  fn make_noise(&self) {
    println!("bark");
  }
}

impl MakeNoise for Cat {}

fn main() {
  let dog = Dog {};
  let cat = Cat {};
  dog.make_noise();
  cat.make_noise();
}
"""
answer.doesCompile = true
answer.stdout = "bark\n(silence)"
context = """
`MakeNoise`-এর implementation `Dog`-এর জন্য একটি নির্দিষ্ট implementation দেয় এবং `Cat`-এর জন্য default implementation ব্যবহার করে।
তাই প্রতিটির ওপর `make_noise` call করলে যথাক্রমে `bark` ও `(silence)` print হয়। 
"""

