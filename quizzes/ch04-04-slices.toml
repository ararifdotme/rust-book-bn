prompt.program = """
fn main() {
  let mut s = String::from("hello");
  for &item in s.as_bytes().iter() {
    if item == b'l' {
      s.push_str(" world");
    }
  }
  println!("{s}");
}
"""
answer.doesCompile = false
answer.lineNumber = 5
context = """
`s.as_bytes()` যেহেতু `s`-এর একটি immutable reference তৈরি করে, তাই for-loop-এর ভেতরে (`push_str` দিয়ে) `s` mutate করা অবৈধ।
"""