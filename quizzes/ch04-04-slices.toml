[[questions]]
id = "7fbda6e4-dca7-458e-ab52-fab03181f90b"
type = "MultipleChoice"
prompt.prompt = """
নিচের প্রোগ্রামের `s2` আর `s3` variable দুটি দেখুন। এই দুটি variable মেমোরিতে থাকবে `main`-এর stack frame-এর ভেতরে। stack-এ প্রতিটি variable-এর মেমোরিতে একটি আকার আছে, যার মধ্যে নির্দেশিত ডেটার আকার ধরা *হয় না*। `s2` আর `s3`-এর আকার সম্পর্কে কোন বক্তব্যটি সত্য?

```
fn main() {
  let s = String::from("hello");
  let s2: &String = &s;
  let s3: &str = &s[..];
}
```
"""
answer.answer = "`s3`-এর byte সংখ্যা `s2`-এর চেয়ে বেশি"
prompt.distractors = [
  "`s3`-এর byte সংখ্যা `s2`-এর সমান",
  "`s3`-এর byte সংখ্যা `s2`-এর চেয়ে কম"
]
context = """
`&String` type একটি সাধারণ reference, যা একটিমাত্র pointer দিয়ে গঠিত, তাই 64-bit architecture-এ 8 byte। `&str` type একটি বিশেষ slice reference, যা একটি pointer *এবং* একটি দৈর্ঘ্য দিয়ে গঠিত, তাই 16 byte। ফলে `&str` type-এর `s3` `&String` type-এর `s2`-এর চেয়ে বেশি মেমোরি ব্যবহার করে। আপনি নিজেই [`std::mem::size_of`](https://doc.rust-lang.org/std/mem/fn.size_of.html) ব্যবহার করে এটি যাচাই করতে পারেন, এভাবে:

```rust
fn main() {
  println!(
    "&String={} &str={}",
    std::mem::size_of::<&String>(),
    std::mem::size_of::<&str>(),
  );
}
```

এছাড়া লক্ষ করুন, reference-এর প্রেক্ষাপট অনুযায়ী Rust নিজে থেকেই string reference-কে `&String` বা `&str`-এ রূপান্তর করে। তাই `&s`-এর প্রত্যাশিত type অনুযায়ী `&s` expression দুটি আলাদা মান তৈরি করে।
"""

