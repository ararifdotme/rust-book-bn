[[questions]]
id = "79942534-f414-41e6-944f-96d57905632c"
type = "MultipleChoice"
prompt.prompt = "দুটি string জোড়া লাগাতে `a + b` আর `a.push_str(b)` ব্যবহারের পার্থক্য কী?"
answer.answer = "`+` `a`-এর ownership নিয়ে নেয়, কিন্তু `push_str` নেয় না"
prompt.distractors = [
  "runtime-এ `push_str` `+`-এর চেয়ে বেশি দক্ষ",
  "`push_str` `b`-এর ownership নিয়ে নেয়, কিন্তু `+` নেয় না",
  "কোনো পার্থক্য নেই, এরা একই function-এর বিকল্প নাম"
]
context = """
`push_str` নেয় `&mut self`, আর `+` নেয় `self`, তাই `+` ownership নিয়ে নেয় আর `push_str` নেয় না।
"""

[[questions]]
id = "f1ab2171-96f0-4380-b16d-9055a9a00415"
type = "ShortAnswer"
prompt.prompt = """
এই প্রোগ্রামে সর্বোচ্চ কতবার heap-এ বরাদ্দ ঘটতে পারে? উত্তর অঙ্কে লিখুন, যেমন 0 বা 1।

```
let s1 = String::from("tic");
let s2 = String::from("tac");
let s3 = String::from("toe");

let s = s1 + "-" + &s2 + "-" + &s3;
```
"""
answer.answer = "7"
context = """
`String::from`-এর প্রতিটি call-এর জন্য একটি বরাদ্দ, আর প্রতিবার `+` call হলে একটি করে বরাদ্দ।
"""
