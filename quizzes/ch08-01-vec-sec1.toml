type = "Tracing"
prompt.program = """
fn main() {
  let v = vec![String::from("Hello ")];
  let mut s = v[0];
  s.push_str("world");
  println!("{s}");
}
"""
answer.doesCompile = false
answer.lineNumber = 3
context = """
