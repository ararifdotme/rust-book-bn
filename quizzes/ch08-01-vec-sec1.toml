[[questions]]
id = "1665d1ef-961f-4451-a988-ec46121531f9"
type = "MultipleChoice"
prompt.prompt = """
এই `find_until` function-এর কোন call runtime-এ panic ঘটাবে?

```
fn find_until(v: &Vec<i32>, n: i32, til: usize) -> Option<usize> {
  for i in 0 .. til {
    if v[i] == n {
      return Some(i);
    }
  }
  return None;
}
```
"""
answer.answer = "`find_until(&vec![1, 2, 3], 4, 4)`"
prompt.distractors = [
  "`find_until(&vec![1, 2, 3], 0, 0)`",
  "`find_until(&vec![1, 2, 3], 3, 3)`",
  "`find_until(&vec![1, 2, 3], 1, 4)`"
]
context = """
`til = 4` হলে 3 দৈর্ঘ্যের একটি vector-এর জন্য for-loop `i = 3` দিয়ে vector-এ index করার চেষ্টা করবে, যা সীমার বাইরে।
`n = 1` হলে এই function panic করে না, কারণ সীমার বাইরের index-এ পৌঁছানোর আগেই এটি return করে।
"""

[[questions]]
id = "789dfffc-7556-443d-98ab-5d0a4db5c162"
type = "Tracing"
prompt.program = """
fn main() {
  let mut v = Vec::new();
  let s = String::from("Hello ");
  v.push(s);
  v[0].push_str("world");
  println!("original: {}", s);
  println!("new: {}", v[0]);
}
"""
answer.doesCompile = false
answer.lineNumber = 6
context = """
`Vec::push` তার argument move করে, তাই `v.push(s)` call করার পর `s` আর ব্যবহারযোগ্য নয়। তাই `println!("original: {}", s)` call করা ownership-এর দিক থেকে নিরাপদ নয়।
"""

