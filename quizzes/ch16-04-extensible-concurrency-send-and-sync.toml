[[questions]]
id = "43081862-aac8-4e18-9c55-1107ea4c7cc1"
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনি এমন একটি database connection-এর API নকশা করছেন:

```
struct DbConnection { /* ... */ }
impl DbConnection {
    fn query(&self) -> DbResult {
        /* ... */
    }
}
```

আপনার database একই connection থেকে একসঙ্গে একাধিক query সমর্থন করে না। 
`DbConnection`-এর নিচের কোন marker trait implement করা উচিত?
"""
answer.answer = "`Send`"
prompt.distractors = [
    "`Send` এবং `Sync`",
    "`Sync`",
    "`Send` বা `Sync` কোনোটিই নয়"
]
context = """
thread-এর মধ্যে একটি `DbConnection` পাঠানোয় কোনো সমস্যা নেই, তাই `DbConnection`-এর `Send` implement করা উচিত।
কিন্তু যেমন, একটি `Arc<Database>` এমনভাবে ভাগ করা বৈধ হবে না যাতে একাধিক thread একসঙ্গে
`db.query()` call করে, তাই `DbConnection`-এর `Sync` implement করা উচিত নয়।
"""