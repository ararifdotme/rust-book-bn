type = "Tracing"
prompt.program = """
struct Point {
  x: i32,
  y: i32,
}

fn main() {
  let mut p = Point { x: 1, y: 2 };
  let x = &mut p.x;
  let y = &mut p.y;
  *x += 1;
  *y += 1;
  println!("{} {}", p.x, p.y);
}
"""
answer.doesCompile = true
answer.stdout = "2 3"
context = """ 
Rust বোঝে যে `.x` আর `.y` আলাদা বস্তু নির্দেশ করে, তাই দুটি field-এরই একই সময়ে mutable reference নেওয়া
বৈধ।
"""