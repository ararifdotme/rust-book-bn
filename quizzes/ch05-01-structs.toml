[[questions]]
id = "bba8893d-f59f-492a-b639-ea04a5c8093b"
type = "Tracing"
prompt.program = """
struct Point {
  x: i32,
  y: i32,
}

fn main() {
  let mut a = Point { x: 1, y: 2 };
  a.x += 1;
  let b = Point { y: 1, ..a };
  a.x += 1;
  println!("{}", b.x);
}
"""
answer.doesCompile = true
answer.stdout = "2"
context = """ 
`..a` syntax `a`-এর প্রতিটি field (`y` ছাড়া) `b`-তে কপি করে, তাই দ্বিতীয় `a.x += 1` `b`-এর ওপর কোনো প্রভাব ফেলে না।
"""

