[multipart]
q = """
**প্রেক্ষাপট:** আপনি একটি সরল user interface framework নকশা করছেন, যা লেখা আর button-এর মতো widget-এর একটি tree দিয়ে গঠিত।

**কার্যক্ষমতা:** API একটি `Widget` trait দেয়, যা সংজ্ঞায়িত করে একটি widget কীভাবে কাজ করে। API-র ব্যবহারকারী `Widget` trait implement করে, এবং একটি UI আঁকতে (render করতে) এটি call করে।

**নকশা:** কার্যক্ষমতাটি implement করার জন্য নিচে কয়েকটি প্রস্তাবিত নকশা দেওয়া হলো।

```
// Option 1: children must be Self
pub trait Widget: Sized {
	fn render(&self) -> Vec<Self>;
}

// Option 2: children are a trait parameter
pub trait Widget<Children> {
	fn render(&self) -> Vec<Children>;
}

// Option 3: children are an associated type
pub trait Widget {
	type Children: Widget;
	fn render(&self) -> Vec<Self::Children>;
}

// Option 4: children are a reference trait object
pub trait Widget {
	fn render(&self) -> Vec<&dyn Widget>;
}

// Option 5: children are a boxed trait object
pub trait Widget {
	fn render(&self) -> Vec<Box<dyn Widget>>;
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:** API-র ব্যবহারকারী সব সম্ভাব্য widget বোঝানো একটিমাত্র `WidgetImpl` enum দেবে এবং `WidgetImpl`-এর জন্য `Widget` trait implement করবে বলে আশা করা হয়।
"""
prompt.distractors = ["2", "3", "4", "5"]
prompt.sortAnswers = true
answer.answer = ["1"]
context = """
সব সম্ভাব্য widget-কে যদি একটিমাত্র enum হিসেবে প্রকাশ করি, এভাবে:

```
enum WidgetImpl {
  Button { /* .. */ },
  Text { /* .. */ },
  // ..
}

impl Widget for WidgetImpl { /* .. */ }
```

তাহলে আমাদের একটি "বদ্ধ জগৎ" system, যেখানে সম্ভাব্য widget-এর সেট বাড়ানো যায় না। `Widget`-এর মাত্র একটি implementation আছে, আর dynamic dispatch-এর দরকার নেই। 
তাই শুধু Option 1 অর্থবহ, কারণ `render` সবসময় শুধু অন্য `WidgetImpl` type-ই return করবে। এই চাহিদায় বাকি সব নকশায় অপ্রয়োজনীয় জটিলতা আছে।
"""
id = "e529cabf-a14c-4f1b-865f-1f376b704df8"

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:** API-র ব্যবহারকারী প্রতিটি সম্ভাব্য widget-এর জন্য একটি অনন্য struct দেবে এবং প্রতিটি struct-এর জন্য `Widget` trait implement করবে বলে আশা করা হয়। 
প্রতিটি widget যেকোনো সম্ভাব্য type-এর widget-যুক্ত একটি vector return করতে পারে।
"""
prompt.distractors = ["1", "2", "3"]
prompt.sortAnswers = true
answer.answer = ["4", "5"]
context = """
আগের প্রশ্নের মতো নয়, এখন আমরা প্রতিটি widget-এর জন্য একটি আলাদা type আশা করি, যেমন:

```
struct Button { /* .. */ }
impl Widget for Button { /* .. */ }

struct Text { /* .. */ }
impl Widget for Text { /* .. */ }
```

তাই widget-এর একটি vector-কে বিভিন্ন জাতের হতে হবে, অর্থাৎ এতে ভিন্ন ভিন্ন type-এর widget থাকতে পারে।
Option 1, 2 আর 3 সবগুলোই প্রতিটি `Widget::render` implementation-কে একটিমাত্র widget type-এর vector return করতে বাধ্য করে।
Option 4 আর 5 বিভিন্ন জাতের widget-এর vector সম্ভব করতে trait object-এর মাধ্যমে dynamic dispatch ব্যবহার করে।
"""
id = "0fdd5ca0-835f-4999-8d24-37841cb0a1a7"


