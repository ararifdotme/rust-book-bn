[multipart]
q = """
**প্রেক্ষাপট:** আপনি একটি game engine-এর জন্য একটি সরল asset manager (ছবি, শব্দ ইত্যাদি সম্পদ সামলানোর ব্যবস্থা) নকশা করছেন।

**কার্যক্ষমতা:** API-র একজন ব্যবহারকারী load করার জন্য asset-এর path দেবে, আর load হওয়া asset-এ প্রবেশাধিকার ফেরত পাবে।

**ধরে নেওয়া বিষয়:** ধরে নিতে পারেন যে load synchronous-ভাবে এবং তাৎক্ষণিকভাবে ঘটে।

**নকশা:** কার্যক্ষমতাটি implement করার জন্য নিচে কয়েকটি প্রস্তাবিত নকশা দেওয়া হলো।

```
pub struct AssetManager {
    // ...
}

// Option 1: return a reference
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> &Asset;
}

// Option 2: return a mutable reference
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> &mut Asset;
}

// Option 3: return a reference-counted pointer
impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> Rc<Asset>;
}

// Option 4: return a copyable handle that can be turned into a reference
#[derive(Copy, Clone)]
pub struct AssetHandle(usize);

impl AssetManager {
    pub fn load(&mut self, path: PathBuf) -> AssetHandle;
    pub fn get(&self, handle: AssetHandle) -> &Asset;
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:** একবার load হলে একটি asset স্থায়ীভাবে immutable থাকা উচিত।
"""
prompt.distractors = ["2"]
prompt.sortAnswers = true
answer.answer = ["1", "3", "4"]
context = """
asset-এর immutability প্রয়োগ করে এমন type, যা পরিবর্তনের operation অনুমোদন করে না। একটি immutable borrow `&Asset`
আর `Rc`-এর মতো একটি immutable smart-pointer, কোনোটিই পরিবর্তনের operation অনুমোদন করে না। তাই Option 1, 3 আর 4 এই চাহিদা পূরণ **করে**।
Option 2 একটি mutable borrow return করে, যা চাহিদা পূরণ **করে না**।
"""
id = "10ae140e-72a6-4594-802a-d656f33cd836"


[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:**  asset manager-এর ব্যবহারকারীদের asset manager-এর কয়েকটি স্বল্পমেয়াদি borrow জুড়ে asset-এ প্রবেশাধিকার ধরে রাখতে হবে।
"""
prompt.distractors = ["1", "2"]
prompt.sortAnswers = true
answer.answer = ["3", "4"]
context = """
"borrow জুড়ে প্রবেশাধিকার ধরে রাখা" মানে ব্যবহারকারী এমন একটি প্রোগ্রাম লিখতে চায়:

```
let asset = {
    let manager = get_manager();
    manager.load("some/path")
};
process_asset(asset);
let another_asset = {
    let manager = get_manager();
    manager.load("another/path")
};
```

এই ক্ষেত্রে `load`-এর return করা মানের lifetime `AssetManager`-এর lifetime-এর সঙ্গে বাঁধা থাকা চলবে না। Option 1 আর 2
চায় `&Asset` আর `&mut Asset` শুধু `&mut self`-এর সমান সময় বাঁচুক। তাই borrow checker
ওপরের মতো প্রোগ্রাম বাতিল করবে, যেখানে একটি asset manager-এর reference-এর চেয়ে বেশি সময় বাঁচে। Option 1 আর 2 চাহিদা পূরণ **করে না**।

Option 3 আর 4 চাহিদা পূরণ **করে**। `Rc<Asset>`-এর lifetime `&mut self`-এর lifetime-এর সঙ্গে বাঁধা নয়। একইভাবে
`AssetHandle`-এর lifetime-ও `&mut self`-এর lifetime-এর সঙ্গে বাঁধা নয়।
"""
id = "b69cde98-8ccd-4a89-aeeb-80a3338f9e68"


[[questions]]
multipart = "q"
type = "MultipleChoice"
prompt.prompt = """
নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:** সব asset একটিমাত্র, আগে থেকে অনুমেয় সময়ে deallocate হওয়া গুরুত্বপূর্ণ।
"""
prompt.distractors = ["3"]
prompt.sortAnswers = true
answer.answer = ["1", "2", "4"]
context = """
সব asset একসঙ্গে deallocate করতে `AssetManager`-কে এগুলোর ওপর একচেটিয়া ownership ধরে রাখতে হবে।
তাহলে `AssetManager` drop হলে (বা অন্যভাবে asset deallocate করতে বলা হলে) 
নিশ্চিত থাকা যায় যে সব asset নিরাপদে drop করা যাবে।
Option 1, 2 আর 4 এই চাহিদা পূরণ **করে**। Option 4-এর ক্ষেত্রে, একটি asset deallocate হওয়ার পর ব্যবহারকারী `manager.get(handle)` call করলে
`AssetManager::get`-কে panic করতে হবে। ব্যবহারকারীর এমন করার বাস্তব সম্ভাবনা থাকলে
আরেকটি বিকল্প হলো `get`-কে দিয়ে `Option<&Asset>` return করানো।

Option 3 এই চাহিদা পূরণ **করে না**। reference-counted pointer-এর মালিকানা একটি `Rc<Asset>`-এর সব owner যৌথভাবে ভাগ করে।
deallocation-এর সময় সব asset-এর আর কোনো owner নেই, তা নিশ্চিত করার কোনো ভালো উপায় `AssetManager`-এর নেই।
"""
id = "48527488-ecfc-4f16-9824-76a3ac7183f4"
