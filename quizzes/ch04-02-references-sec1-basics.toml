id = "7cf19153-3647-4afc-953a-f9392ddb96fb"
type = "MultipleChoice"
prompt.prompt = """
নিচের প্রোগ্রামটি দেখুন, শেষ লাইনের পরে মেমোরির অবস্থা দেখানো হয়েছে:
 
```aquascope,interpreter
fn get_first(vr: &Vec<i32>) -> i32 {
  vr[0]
}

fn main() {
  let mut v = vec![0, 1, 2];
  let n = get_first(&v);
  println!("{} {}", n, v[1]);`[]` 
}
```

`get_first` call করার পর `v` কেন deallocate হয় না, তা নিচের কোনটি সবচেয়ে ভালোভাবে ব্যাখ্যা করে?
"""
answer.answer = "`vr` একটি reference, যা যে vector-কে নির্দেশ করে তার owner নয়"
prompt.distractors = [
  "`get_first`-এর ভেতরে `vr` mutate করা হয়নি",
  "`get_first` vector-টি নয়, বরং `i32` type-এর একটি মান return করে",
  "`get_first` call করার পর `println`-এ `v` ব্যবহার করা হয়েছে"
]
context = """
reference হলো non-owning pointer। তাই `get_first`-এ `&v` পাঠালে `v`-এর ownership `get_first`-এ move হয় না,
আর ফলে `get_first` শেষ হওয়ার পর `v` deallocate হয় না।
"""