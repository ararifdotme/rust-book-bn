[[questions]]
id = "0b8dbb4f-7c56-4b6e-8358-95c7b46f90c3"
type = "ShortAnswer"
prompt.prompt = """
নিচের প্রোগ্রামটি দেখুন, শেষ লাইনের পরে মেমোরির অবস্থা দেখানো হয়েছে:
```aquascope,interpreter
#fn main() {
let x = Box::new(0);
let y = Box::new(&x);`[]`
#}
```

`y`-এর মাধ্যমে সংখ্যা `0`-কে কপি করে বের করতে চাইলে আপনাকে কয়টি dereference ব্যবহার করতে হবে? 
উত্তর একটি অঙ্ক হিসেবে লিখুন। যেমন, সঠিক expression যদি `*y` হয়, তাহলে উত্তর 1। 
"""
answer.answer = "3"
context = """
সঠিক expression হলো `***y`। `y`-এর type হলো `Box<&Box<i32>>`। এটি একটি heap pointer, যা একটি stack reference-কে নির্দেশ করে, 
আর সেটি নির্দেশ করে একটি heap pointer-কে। তাই `y`-কে তিনবার dereference করতে হবে, পরোক্ষতার প্রতিটি স্তরের জন্য একবার।
"""

