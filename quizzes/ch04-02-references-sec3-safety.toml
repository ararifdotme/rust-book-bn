[[questions]]
id = "80f6bcd6-b74a-4da3-a014-d423c82ce405"
type = "MultipleChoice"
prompt.prompt = """
এই Rust function-টি দেখুন, যা একটি vector-এর শেষে একটি সংখ্যা push করে, তারপর vector-এর সামনে থেকে একটি সংখ্যা সরিয়ে সেটি return করে:

```
fn give_and_take(v: &Vec<i32>, n: i32) -> i32 {
    v.push(n);
    v.remove(0)
}
```

সাধারণত এই function compile করার চেষ্টা করলে compiler নিচের error দেয়:

```text
error[E0596]: cannot borrow `*v` as mutable, as it is behind a `&` reference
 --> test.rs:2:5
  |
1 | fn give_and_take(v: &Vec<i32>, n: i32) -> i32 {
  |                     --------- help: consider changing this to be a mutable reference: `&mut Vec<i32>`
2 |     v.push(n);
  |     ^^^^^^^^^ `v` is a `&` reference, so the data it refers to cannot be borrowed as mutable
```

ধরে নিন, compiler এই function বাতিল **করেনি**। নিচের প্রোগ্রামগুলোর মধ্যে চালালে যেগুলো (যদি থাকে)
undefined behavior ঘটাতে পারে, সেগুলোর প্রতিটি বেছে নিন। কোনো প্রোগ্রামই undefined behavior ঘটাতে না পারলে 
"এগুলোর কোনোটিই নয়" বেছে নিন।
"""
answer.answer = [
"""
```
let v = vec![1, 2, 3];
let n = &v[0];
give_and_take(&v, 4);
println!("{}", n);
```
""",
]
prompt.distractors = [
"""
```
let v = vec![1, 2, 3];
let v2 = &v;
give_and_take(&v, 4);
println!("{}", v2[0]);
```
""",
"""
```
let v = vec![1, 2, 3];
let n = &v[0];
let k = give_and_take(&v, 4);
println!("{}", k);
```
""",
"এগুলোর কোনোটিই নয়"
]
context = """
এই অংশে আগে যেমন দেখেছি, `v.push(n)`-এর ফলে `v` তার ভেতরের বিষয়বস্তু নতুন করে বরাদ্দ করতে পারে, ফলে heap-এ থাকা `v`-এর উপাদানগুলোর সব reference অবৈধ হয়ে যায়।
তাই `give_and_take(&v, 4)` call করলে আগে তৈরি উপাদান-reference-গুলো অবৈধ মেমোরিকে নির্দেশ করবে। যে দুটি প্রোগ্রাম `give_and_take`-এর আগে `let n = &v[0]`
bind করে, সেগুলো undefined behavior-এর সম্ভাব্য প্রার্থী। `let v2 = &v` প্রার্থী নয়, কারণ ধারক `v`-এর reference আসলে `v` mutate করলে 
অবৈধ হয় না।

যে প্রোগ্রামটি `println!("{}", n)` করে, সেটি অবৈধ মেমোরি পড়ে undefined behavior ঘটাবে। যে প্রোগ্রামটি `println!("{}", k)` করে, সেটি undefined
behavior ঘটাবে না, কারণ এটি অবৈধ হয়ে যাওয়া reference ব্যবহার করে না।
"""