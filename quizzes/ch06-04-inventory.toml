}
```

এই function compile করার চেষ্টা করলে আপনি যে compiler error পেতেন, নিচের কোনটি তা সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "cannot move out of `arg` in `arg.unwrap()`"
prompt.distractors = [
  "cannot call `arg.is_none()` without dereferencing `arg`",
  "`arg` does not live long enough",
  "cannot return `s.clone()` which does not live long enough"
]
context = """
`Option::unwrap` function `self` আশা করে, অর্থাৎ এটি `arg`-এর ownership আশা করে। কিন্তু `arg` একটি option-এর immutable
reference, তাই এটি option-টির ownership দিতে পারে না। তাই compiler আপত্তি জানায় যে আমরা 
`unwrap`-এর মাধ্যমে `arg` থেকে move করে বের করতে পারি না।
"""


