context = """
stack-এ বরাদ্দ করা variable-এর pointer return করার কোনো বৈধ উপায় নেই। তাই সহজ সমাধান হলো return type বদলে `String` করা
এবং ইনপুট `user_str`-কে একটি owned string-এ কপি করা। তবে `user_str`-কে `String` হতে বাধ্য করলে API-র নমনীয়তা কমে যাবে, যেমন
caller একটি বড় string-এর substring-এর ওপর `make_separator` call করতে পারবে না। এতে caller-দের string heap-এ বরাদ্দ করতেও বাধ্য করা হবে, যেমন
তারা `make_separator("Rust")`-এর মতো string literal ব্যবহার করতে পারবে না।

এই সমস্যার সবচেয়ে Rust-সুলভ সমাধানে এমন একটি গঠন ব্যবহার হয়, যা আপনি এখনো দেখেননি: [`Cow`](https://doc.rust-lang.org/std/borrow/enum.Cow.html)।
clone-on-write (দরকার হলে তবেই clone করার ব্যবস্থা) smart pointer এই function-কে কোনো type error ছাড়াই *হয়* একটি owned string *নয়তো* একটি string reference return করতে দেবে।
"""

