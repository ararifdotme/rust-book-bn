type = "MultipleChoice"
prompt.prompt = """
**প্রোগ্রাম 1:**

```ide
/// Makes a string to separate lines of text, 
/// returning a default if the provided string is blank
fn make_separator(user_str: &str) -> &str {
    if user_str == "" {
        let default = "=".repeat(10);
        &default
    } else {
        user_str
    }
}
```

এই function compile করার চেষ্টা করলে আপনি যে compiler error পেতেন, নিচের কোনটি তা সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "cannot return reference to local variable `default`"
prompt.distractors = [
  "`user_str` does not live long enough",
  "function `make_separator` cannot return a reference of type `&str`",
  "function `make_separator` cannot return two different references"
]
context = """
`default` যেহেতু `make_separator`-এর ভেতরে stack-এ থাকে, তাই `make_separator`-এর একটি call শেষ হলেই এটি deallocate হয়ে যাবে।
ফলে `&default` deallocate হওয়া মেমোরিকে নির্দেশ করতে থাকে। তাই Rust আপত্তি জানায় যে একটি local variable-এর reference return করা যায় না।
"""

