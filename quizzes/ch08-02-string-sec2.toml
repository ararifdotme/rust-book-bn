`&str` একটি প্রতিশ্রুতি যে এটি যে byte-ক্রমকে নির্দেশ করে, তা সবসময় বৈধ UTF-8 হবে। তাই যে প্রোগ্রামার, যেমন, একটি `&str` প্রিন্ট করতে
