prompt.distractors = [
  "`s`-এর ওপর `f`-এর কোনো প্রভাব নেই",
  "`f` `s` পড়ে, তারপর ফলাফল ফেলে দেয়",
  "`f` তার environment-এ `s` capture করে"
]
context = """
