[[questions]]
id = "a2a1546b-27bf-47d2-a1bc-86d777573f40"
type = "Tracing"
prompt.program = """
use std::fmt::Display;
fn displayable<T: Display>(t: T) -> impl Display { t }

fn main() {
  let s = String::from("hello");
  let mut s2 = displayable(s);
  s2.push_str(" world");
  println!("{s2}");
}
"""
answer.doesCompile = false
answer.lineNumber = 7
context = """
`displayable` যেহেতু `impl Display` return করে, তাই আমরা শুধু জানি যে `s2` এমন *কোনো* type যা `Display` implement করে, 
এটা জানি না যে এটি `push_str` method-যুক্ত একটি `String`। তাই `s2.push_str(..)` call করা যায় না। যদি `displayable`-এর return
type `-> T` হতো, তাহলে এই প্রোগ্রাম compile হতো।
"""


