type = "MultipleChoice"
prompt.prompt = """
`Option` type-এর জন্য implement করা এই method-টি দেখুন:

```
impl<T> Option<T> {
  fn unwrap_or(self, other: T) -> T {
    match self {
      Some(t) => t,
      None => other
    }
  }
}
```

এই function-এর আচরণ কোন বাক্যটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "`self`-এর ভেতরের বস্তুটি থাকলে সেটি return করে, অন্যথায় `other`"
prompt.distractors = [
  "`self`-এর ভেতরের বস্তুটি থাকলে সেটিসহ একটি নতুন option return করে, অন্যথায় `other`",
  "`self`-এ আগে থেকে কোনো মান না থাকলে `other`-কে `self`-এ ঢুকিয়ে দেয়",
  "`self`-এর ভেতরের বস্তুটি থাকলে তার একটি reference return করে, অন্যথায় `other`"
]
context = """
এই function option-টির ownership নিয়ে ভেতরের মানটি বের করে এনে option-টিকে "unwrap" করে, কিন্তু কোনো মান না থাকলে বিকল্প হিসেবে `other` return করে।
এটি standard library-র একটি আসল function!
"""


