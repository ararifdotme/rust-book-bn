prompt.prompt = """
একজন Rust প্রোগ্রামার কমান্ড লাইন ইন্টারফেস লেখার জন্য একটি library নকশা করছেন। 
এই library-র অংশ হিসেবে তিনি ব্যবহারকারীর দেওয়া কমান্ড লাইন flag parse করার একটি function implement করছেন। 
এই কাজের ক্ষেত্রের জন্য কোন implementation সবচেয়ে উপযুক্ত হবে?

```
fn parse_flag_v1(flag: &str) -> Result<String, String> {
  match flag.strip_prefix("--") {
    Some(no_dash) => Ok(no_dash.to_string()),
    None => Err(format!("Invalid flag {flag}"))
  }
}

fn parse_flag_v2(flag: &str) -> String {
  match flag.strip_prefix("--") {
    Some(no_dash) => no_dash.to_string(),
    None => panic!("Invalid flag {flag}")
  }
}
```
"""
answer.answer = "`parse_flag_v1`"
prompt.distractors = [ "`parse_flag_v2`" ]
prompt.answerIndex = 0
context = """
এখানে প্রোগ্রামার সম্ভবত একটি *recoverable* error (`Result`) ব্যবহার করতে চাইবেন। একজন CLI ব্যবহারকারী ভুল ফরম্যাটের একটি flag দিলে
CLI library হয়তো সম্ভাব্য flag-গুলোর তালিকা দেখানোর মতো বাড়তি সাহায্য দিতে চাইবে। একটি panic অ্যাপ্লিকেশনকে শুধু panic বার্তাটি
দেখাতে বাধ্য করত, যা সম্ভবত ব্যবহারকারীর জন্য খারাপ অভিজ্ঞতা হতো।
"""
