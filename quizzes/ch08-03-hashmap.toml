type = "Tracing"
prompt.program = """
use std::collections::HashMap;
fn main() {
  let mut h: HashMap<char, Vec<usize>> = HashMap::new();
  for (i, c) in "hello!".chars().enumerate() {
    h.entry(c).or_insert(Vec::new()).push(i);
  }
  let mut sum = 0;
  for i in h.get(&'l').unwrap() {
    sum += *i;
  }
  println!("{}", sum);
}
"""
answer.doesCompile = true
answer.stdout = "5"
context = """
এই প্রোগ্রাম একটি hashmap-এ প্রতিটি অক্ষরের প্রতিটি উপস্থিতির index-এর একটি vector রাখে। 
তারপর এটি 'l' অক্ষরের সব index যোগ করে, যা `"hello!"` string-এ index 2 আর 3-এ আছে।
"""
