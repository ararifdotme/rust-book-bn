type = "MultipleChoice"
prompt.prompt = """
একটি callback নেয় এমন একটি `register` function দুইভাবে implement করার কথা ভাবুন:

```
fn register1(cb: fn(Event) -> ());
fn register2<F>(cb: F) where F: Fn(Event) -> ();
```

কোন type signature `register`-কে সবচেয়ে বেশি রকমের argument নিতে দেয়?
"""
answer.answer = "`register2`"
prompt.distractors = [
  "`register1`",
  "দুটি সমতুল্য"
]
context = """
environment-যুক্ত closure `register2`-এ পাঠানো যায়, অন্যদিকে `register1`-এ শুধু top-level function (বা environment ছাড়া closure) পাঠানো যায়।
"""