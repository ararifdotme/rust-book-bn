type = "ShortAnswer"
prompt.prompt = "একটি function যে unit test তা বোঝাতে আপনি এতে কোন annotation যোগ করেন?"
answer.answer = "#[test]"
context = """
এটি cargo-র testing harness-কে জানায় যে function-টিকে library কোড নয়, test হিসেবে গণ্য করতে হবে।
"""

[[questions]]
id = "cd77485f-723a-4978-8da6-c4ca3df44c44"
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনার কাছে এই type signature-এর একটি function আছে:

```
fn f(x: usize) -> Result<usize, String>;
```

আর আপনি test করতে চান যে `f(0)` `Err(_)` return করবে। 
নিচের কোনটি তা test করার বৈধ উপায় **নয়**?
"""
answer.answer = """
```
#[test]
#[should_err]
fn test() -> Result<usize, String> {
  f(0)
}
```
  """
prompt.distractors = [
  """
```
#[test]
fn test() {
  assert!(f(0).is_err());
}
```
  """,
  """
```
#[test]
#[should_panic]
fn test() { 
  f(0).unwrap();
}
```
  """,
  """
```
#[test]
fn test() {
  assert!(match f(0) {
    Ok(_) => false,
    Err(_) => true
  });  
}
```
  """
]
context = """
Rust-এ `should_err` বলে কিছু নেই &mdash; `Result` return করে এমন যেকোনো test-কে pass করতে হলে `Ok` return করতে হবে।
"""