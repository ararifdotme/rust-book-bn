prompt.distractors = [
  "cannot borrow `v` as immutable for `v.len()` when `v` is a mutable borrow",
  "cannot mutably borrow an element `v[i]` of a mutable vector"
]
context = """
array-তে পৌঁছাতে ব্যবহৃত index-গুলোর নির্দিষ্ট মান compiler বিবেচনা করে না, তাই `&mut v[i]`
আর `&mut v[n - i - 1]` একই উপাদান নির্দেশ করতে পারে বলে ধরে নেওয়া হয়। তাই আমরা এমন একটি error পাই,
