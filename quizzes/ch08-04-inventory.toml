context = """
memory safety লঙ্ঘন করতে হলে `remove_zeros`-কে এমন একটি vector দিয়ে call করতে হবে, যাতে প্রথম উপাদানের পরে একটি শূন্য আছে।
`v.shrink_to_fit()` call vector-এর মালিকানাধীন মেমোরি deallocate করবে (আকার বদলানোর কারণে), যা
