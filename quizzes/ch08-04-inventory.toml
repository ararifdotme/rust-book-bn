type = "MultipleChoice"
prompt.prompt = """
**প্রোগ্রাম 1:**

```ide
/// Removes all the zeros in-place from a vector of integers.
fn remove_zeros(v: &mut Vec<i32>) {
    for (i, t) in v.iter().enumerate().rev() {
        if *t == 0 {
            v.remove(i);
            v.shrink_to_fit();
        }
    }
}
```

এই function compile করার চেষ্টা করলে আপনি যে compiler error পেতেন, নিচের কোনটি তা সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "`v.remove(i)` cannot borrow `v` as mutable"
prompt.distractors = [
  "`v` does not live long enough to call `v.remove(i)`",
  "`t` cannot be dereferenced while `i` is live",
  "`v.iter()` cannot be called on a mutable reference"
]
context = """
`v.iter()` function পুরো for-loop জুড়ে একটি vector `v`-কে immutable-ভাবে borrow করে। কিন্তু `v.remove(i)`-এর জন্য `v`-এর একটি mutable
reference দরকার। তাই `v.remove(i)` `v`-কে mutable হিসেবে borrow করতে পারে না, কারণ তা iterator-এর সঙ্গে সংঘাত ঘটাত।
"""


