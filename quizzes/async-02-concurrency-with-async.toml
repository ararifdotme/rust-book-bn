[[questions]]
type = "MultipleChoice"
prompt.prompt = """
নিচের function-টি বিবেচনা করুন:

```rust
async fn print_letters() {
  let a = async { print!("A"); };
  let b = async { print!("B"); };
  let c = async { print!("C"); };
  c.await;
  b.await;
  a.await;
}
```

`print_letters().await` চালানোর পর নিচের কোন string-গুলো print হতে পারে?
"""
prompt.distractors = ["`ABC`", "`BCA`", "`ACB`"]
answer.answer = ["`CBA`"]
context = """
এই প্রোগ্রামের আচরণ নির্ধারিত। async block-গুলোর জন্য await না করা পর্যন্ত print-গুলো চলে না।
block-গুলোর জন্য await করা হয় `c`/`b`/`a` ক্রমে, তাই প্রোগ্রাম শুধু `CBA` print করবে।
"""
id = "8f62c158-525a-43a2-aa6a-0cc106cada10"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনাকে এমন আচরণের একটি সহায়ক function `wait_all(a, b)` দেওয়া হলো:
* `wait_all` নিশ্চয়তা দেয় যে `a` আর `b` শেষ পর্যন্ত চলবে।
* ন্যায্যতা বা শুরুতে চলার ক্রম নিয়ে `wait_all` কোনো নিশ্চয়তা দেয় না।

তাহলে নিচের কোডটি দেওয়া থাকলে:

```rust
async fn print_letters() {
  let fut1 = async { 
    print!("A");
    sleep().await;
    print!("B");
  };
  let fut2 = async {
    print!("C");
    sleep().await;
    print!("D");
  }
  wait_all(fut1, fut2).await;
}
```

`print_letters().await` চালানোর পর নিচের কোন string-গুলো print হতে পারে?
"""
prompt.distractors = ["`DABC`"]
answer.answer = [
  "`ABCD`", "`CADB`", "`ACBD`"
]
context = """
কাল্পনিক `wait_all` primitive `join`-এর মতো, তবে কম নিশ্চয়তাসহ। এই প্রশ্নের বিবরণ অনুযায়ী দুটি future-এর যেকোনো মিশ্রণ
বৈধ। একমাত্র অবৈধ output হলো যা প্রোগ্রামের চলার ক্রম উল্টে দেয়, অর্থাৎ `DABC`, যেখানে `C`-এর আগে `D` print হতো।
"""
id = "4b28f13e-9781-4d29-b886-7639fa527f36"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনাকে একটি message-passing channel `channel()` দেওয়া হলো, যা non-blocking এবং *bounded* (সীমিত ধারণক্ষমতার), 
অর্থাৎ `send` এমন একটি future return করে, যা channel-এ জায়গা হলেই শেষ হয়।
ধরে নিন আপনার কাছে `join(a, b)` নামে একটি function-ও আছে, যা তার দুটি argument শেষ হওয়ার জন্য *ন্যায্যভাবে* অপেক্ষা করে। তাহলে এই async কোডটি দেওয়া থাকলে:

```rust
let (tx, mut rx) = channel(16);
let recv_fut = rx.recv();
let send_fut = tx.send(0);
let (n, _) = join(recv_fut, send_fut).await;
println!("{}", n.unwrap());
```

এই কোড চালানোর ফলে কী ঘটবে?
"""
prompt.distractors = [
  "প্রোগ্রাম `0` print করে এবং চিরকাল loop করতে থাকে",
  "প্রোগ্রাম কিছুই print করে না এবং চিরকাল loop করতে থাকে",
  "প্রোগ্রাম panic করে"
]
answer.answer = "প্রোগ্রাম `0` print করে বন্ধ হয়"
context = """
channel যেহেতু non-blocking, তাই চিরকাল loop না করেই পাঠানোর আগে একটি গ্রহণের future তৈরি করা যায়।
"""
id = "e23b7c48-3780-44e7-8ea4-df35032548a1"
