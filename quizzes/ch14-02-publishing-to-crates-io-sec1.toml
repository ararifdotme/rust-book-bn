[[questions]]
id = "cfb65011-0578-4032-8aaa-b346b091602b"
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনি `worldly` নামের একটি library তৈরি করছেন, যার `lib.rs`-এ নিচের function আছে:

    /// Adds the string "world" to `s`.
    ///
    /// # Example
    /// ```
    /// let mut s = String::new();
    /// worldly::add_world(&mut s);
    /// assert_eq!(s, "Hello world");
    /// ```
    pub fn add_world(s: &mut String) {
        s.push_str("world");
    }

    #[test]
    fn test_add_world() {
        let mut s = String::new();
        add_world(&mut s);
        assert_eq!(s, "world");
    }

`cargo test` চালালে কোনো test কি fail করবে?
"""
answer.answer = "হ্যাঁ"
prompt.distractors = [
    "না",    
]
context = """
ভুল উদাহরণটি doc-test হিসেবে চলবে এবং `cargo test`-কে fail করাবে।
"""