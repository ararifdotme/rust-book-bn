id = "97781ca8-ad58-449c-9769-e20b9d2e42a6"
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনার কাছে `&mut Vec<i32>` type-এর একটি variable `v` আছে, আর আপনি নিচের signature-এর
`len` method call করতে চান:

```
impl Vec<i32> {
  fn len(&self) -> usize {
    /* ... */
  }
}
```

`v.len()` expression compile করার চেষ্টা করলে কী ঘটে, তা নিচের কোন বক্তব্যটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "এটি compile হয়, কারণ `&mut` reference-টি অন্তর্নিহিতভাবে একটি `&` reference হিসেবে reborrow হয়"
prompt.distractors = [
  "এটি compile হয় না, কারণ `&mut Vec<i32>` আর `&Vec<i32>` একই type নয়",
  "এটি compile হয় না, `v` স্পষ্টভাবে dereference করা হয়নি",
  "এটি compile হয়, কারণ `&self` যেকোনো ধরনের reference নিতে পারে"
]
context = """
`v.len()` expression desugar হয়ে দাঁড়ায় `Vec::len(&*v)`, যা `v`-এর একটি বৈধ re-borrow, তাই এই expression compile হয়।
তবে `v`-কে সরাসরি `Vec::len`-এ পাঠানো যায় না, কারণ `&self` নির্দিষ্টভাবে immutable reference বোঝায়।
"""

[[questions]]
id = "35a75881-eb08-486c-92b3-413ab512138a"
type = "MultipleChoice"
prompt.prompt = """
একটি struct-এর একটি field-এর মান এক বাড়ায় এমন এই দুটি method দেখুন। কোন ধরনটি বেশি Rust-সুলভ?

```
struct Point(i32, i32);
impl Point {
  fn incr_v1(mut self)  { self.0 += 1; }
  fn incr_v2(&mut self) { self.0 += 1; }
}
```
"""
answer.answer = "`incr_v2`"
prompt.distractors = [
  "`incr_v1`",
  "দুটিই Rust-সুলভ",
  "কোনোটিই Rust-সুলভ নয়"
]
prompt.answerIndex = 1
context = """
`incr_v1` method Rust-সুলভ নয়, কারণ এটি `Point`-এর ownership নিয়ে নেয়। এর মানে `p.incr_v1()` call করার পর `p` 
আর ব্যবহারের উপযোগী থাকবে না, যা সম্ভবত এই method-এর উদ্দেশ্য নয়।
"""

