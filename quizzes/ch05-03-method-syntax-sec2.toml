id = "be7be598-8a31-4c1a-9171-4ff90f512430"
type = "Tracing"
prompt.program = """
struct Point {
  x: i32,
  y: i32
}

impl Point {
  fn get_x(&mut self) -> &mut i32 {
    &mut self.x
  }
}

fn main() {
  let mut p = Point { x: 1, y: 2 };
  let x = p.get_x();
  *x += 1;
  println!("{} {}", *x, p.y);
}
"""
answer.doesCompile = false
answer.lineNumber = 16
context = """ 
`get_x` যেহেতু পুরো `p`-কে mutable-ভাবে borrow করে, তাই `x`-এর ব্যবহার শেষ না হওয়া পর্যন্ত প্রোগ্রাম কোনোভাবেই `p` ব্যবহার করতে পারে না। 
তাই একই লাইনে `x` আর `p.y` পড়া একটি ownership error।
"""