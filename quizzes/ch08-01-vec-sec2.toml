type = "Tracing"
prompt.program = """
fn main() {
  let mut v: Vec<i32> = vec![1, 2, 3];
  let mut v2: Vec<&mut i32> = Vec::new();
  for i in &mut v {
    v2.push(i);
  }
  *v2[0] = 5;

  let a = *v2[0];
  let b = v[0];
  println!("{a} {b}");
}
"""
answer.doesCompile = true
answer.stdout = "5 5"
context = """
`i`-এর type হলো `&mut i32`, অর্থাৎ এটি `v`-এর ভেতরের একটি সংখ্যার pointer। তাই `i`-কে `v2`-তে push করলে `v2`-তে থাকে `v`-এর pointer। ফলে
`v2[0]` mutate করলে আসলে `v[0]` mutate হয়।
"""