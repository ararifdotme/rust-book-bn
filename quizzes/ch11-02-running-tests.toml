[[questions]]
id = "affe428d-0a8e-430b-9567-99e6b7563c0f"
type = "MultipleChoice"
prompt.prompt = """
কোনো বাড়তি configuration ছাড়া `cargo test` চালালে, নিচের কোন কাজটি একাধিক test করলে ঠিকমতো কাজ না-ও করতে পারে?
"""
answer.answer = "একটিমাত্র ফাইলে কিছু লেখা"
prompt.distractors = [
  "stdout-এ string log করা",
  "panic করে fail করা",
  "একটিমাত্র database থেকে ডেটা পড়া"
]
context = """
default-ভাবে test parallel-ভাবে চলে, তাই thread-safe নয় এমন কাজ (যেমন একটিমাত্র ফাইলে লেখা) race condition (একসঙ্গে চলা কাজের মধ্যে প্রতিযোগিতাজনিত সমস্যা) ঘটাতে পারে।
"""

[[questions]]
id = "19e292f4-4bc4-4868-a58a-edf62c3e3b2a"
type = "ShortAnswer"
prompt.prompt = """
নিচের unit test-যুক্ত একটি প্রোগ্রাম বিবেচনা করুন:

```
#[test]
fn test_the_logger() { /* ... */ }

#[test]
fn test_the_database() { /* ... */ }

#[test]
fn test_logger_and_database() { /* ... */ }
```

`cargo test <the_string>`-এ সবচেয়ে *ছোট* কোন string পাঠালে *শুধু* `test_the_logger` আর `test_the_database` চলবে?
"""
answer.answer = "h"
context = """
যে সবচেয়ে ছোট substring `test_logger_and_database`-এ নেই কিন্তু `test_the_logger` ও `test_the_database`-এ আছে,
তা হলো "h" ("the"-এর মাঝের অক্ষর)।
"""