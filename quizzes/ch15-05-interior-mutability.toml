prompt.prompt = """
এমন একটি API বিবেচনা করুন, যা একটি নির্দিষ্ট method কতবার call হয়েছে তার হিসাব রাখে:

```
struct Api {
    count: ???
}

impl Api {
    fn some_method(&self) {
        // increment count
        // rest of the method...
    }    
}
```

ধরুন count একটি `usize` হিসেবে রাখা হয়। এই পরিস্থিতিতে ব্যবহারের জন্য নিচের কোন wrapper type
সবচেয়ে উপযুক্ত হবে?
"""
answer.answer = "`RefCell<usize>`"
prompt.distractors = [
    "`Rc<usize>`",
    "`Box<usize>`",
    "কোনোটিই না, `usize`-ই যথেষ্ট"
]
context = """
`some_method` input হিসেবে একটি immutable reference নিলেও এখানে ভেতরের একটি field পরিবর্তন করতে `RefCell` কাজে লাগে।
ভেতরের field যদি শুধু একটি integer হয়, তাহলে আরও ভালো type হতো
`Cell<usize>` বা `AtomicUsize`।
"""

[[questions]]
id = "d4ae1b8e-79a7-4485-828f-fb30cdeb29d5"
type = "MultipleChoice"
prompt.prompt = """
`RefCell`-এর নিচের ভুল implementation-টি বিবেচনা করুন, যা যাচাই করে না
ভেতরের মানটি borrow করা আছে কি না:

```
use std::cell::UnsafeCell;
struct BadRefCell<T>(UnsafeCell<T>);
impl<T> BadRefCell<T> {
    pub fn borrow_mut(&self) -> &mut T {
        unsafe { &mut *self.0.get() }
    }
}
```

এখন ধরুন আমাদের এমন একটি `BadRefCell` আছে:

```
let v = BadRefCell(UnsafeCell::new(vec![1, 2, 3]));
```

এই API ব্যবহার করে নিচের কোন কোড-অংশ memory safety ভঙ্গ করবে?
"""
answer.answer = """
```
let v1 = v.borrow_mut();
let n = &v1[0];
v.borrow_mut().push(0);
println!("{n}");
```
"""
prompt.distractors = [
"""
```
drop(v.borrow_mut());
drop(v.borrow_mut());
```
""",
"""
```
let v1 = v.borrow_mut();
let v2 = v.borrow_mut();
v1.push(0);
v2.push(0);
```
""",
"""
```
v.borrow_mut().push(0);
let n = v.borrow_mut()[0];
println!("{n}");
```
"""
]
context = """
`BadRefCell` একই সময়ে ভেতরের ডেটার দুটি mutable reference রাখতে দেয়,
যা memory safety ভঙ্গের সুযোগ করে দেয়, যেমন একটি vector-এর বিষয়বস্তুর reference ধরে রাখা অবস্থায় vector-টি reallocate করা।
"""