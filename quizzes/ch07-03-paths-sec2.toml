type = "Tracing"
prompt.program = """
pub mod a {
  pub mod b {
    pub fn f() { println!("b1"); }
    pub mod c {
      pub fn f() { println!("c1"); }
    }
  }
  pub fn entry() { super::b::c::f(); }
}

pub mod b {
  pub fn f() { println!("b2"); }
  pub mod c {
    pub fn f() { println!("c2"); }
  }
}

fn main() {
  crate::a::entry();
}
"""
answer.doesCompile = true
answer.stdout = "c2"
context = """
`entry` path `super::b::c::f` ব্যবহার করে। `entry` আছে module `a`-এর ভেতরে, তাই `super` বোঝায় `a`-এর parent module, অর্থাৎ root crate। 
তারপর root-এর child `b` হলো সবচেয়ে বাইরের module `b`, যার child `c`-তে একটি function `f` আছে, যা `"c2"` প্রিন্ট করে।
"""

