id = "a91417cd-cd6d-416b-b72d-4af6b3fb2fd6"
type = "MultipleChoice"
prompt.prompt = """
একটি reference-এর lifetime `'static` হলে এর মানে:
"""
answer.answer = "reference-এর নিচের ডেটা কখনো deallocate (মুক্ত) হয় না"
prompt.distractors = [
  "reference-এর নিচের ডেটা পরিবর্তন করা যায় না",
  "reference-এর নিচের ডেটা মেমোরির static অঞ্চলে থাকে",
  "reference-এর নিচের ডেটা dynamic নয়"
]
context = """
`'static` মানে "পুরো প্রোগ্রাম জুড়ে জীবিত থাকা", তাই একটি static reference-এর নিচের ডেটা কখনো deallocate হওয়া চলবে না। বাস্তবে `'static` reference
সাধারণত mutable হয় না, তবে `'static` lifetime-এর অর্থের সঙ্গে mutability-র কোনো মৌলিক সম্পর্ক নেই।
"""

