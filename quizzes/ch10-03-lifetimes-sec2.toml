  """
```
fn baz(f: Foo) -> &i32
```
  """,
  """
```
fn baz<'a>(f: Foo<'a>) -> &i32
```
  """,
  """
```
fn baz<'a>(f: Foo) -> &'a i32
```
  """,

]
prompt.answerIndex = 4
context = """
struct-টি একটিমাত্র lifetime parameter নেয়, আর output-এরও একটিমাত্র lifetime, তাই Rust ধরে নেয় এরা একই।
"""

