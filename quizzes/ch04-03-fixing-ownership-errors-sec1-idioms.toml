[[questions]]
id = "e6bc84ef-069c-4d1d-99ec-69b13492569c"
type = "MultipleChoice"
prompt.prompt = """
ধরুন একজন প্রোগ্রামার নিচের function-টি লেখার চেষ্টা করলেন:

```
/// Returns a person's name with "Ph.D." added as a title
fn award_phd(name: &String) -> String {
    let mut name = *name;
    name.push_str(", Ph.D.");
    name
}
```

Rust compiler নিচের error দিয়ে তাদের কোড বাতিল করে দেয়:

```text
error[E0507]: cannot move out of `*name` which is behind a shared reference
 --> test.rs:3:20
  |
3 |     let mut name = *name;
  |                    ^^^^^
  |                    |
  |                    move occurs because `*name` has type `String`, which does not implement the `Copy` trait
  |                    help: consider borrowing here: `&*name`
```

function-টির উল্লিখিত উদ্দেশ্য বিবেচনায়, প্রোগ্রামটির সবচেয়ে Rust-সুলভ সমাধান নিচের কোনটি? 
ওপরের function থেকে পার্থক্যগুলো হাইলাইট করা আছে।
"""
answer.answer = """
```
fn award_phd(name: &String) -> String {
    let mut name = `[name.clone()]`;
    name.push_str(", Ph.D.");
    name
}
```
"""
prompt.distractors = [
"""
```
fn award_phd(name: &String) -> String {
    let mut name = `[&*name]`;
    name.push_str(", Ph.D.");
    name
}
```
""",
"""
```
fn award_phd(`[mut name: String]`) -> String {
    name.push_str(", Ph.D.");
    name
}
```
""",
"""
```
fn award_phd(`[name: &mut String]`) {
    name.push_str(", Ph.D.");
}
```
"""
]
context = """
function-টির উদ্দেশ্য কারও মূল নাম বদলানো নয়, তাই `name`-এর type বদলে `&mut String` বা `String` করা 
অনুপযুক্ত হবে। compiler-এর প্রস্তাবিত সমাধান `&*name` যথেষ্ট নয় --- একটি গ্রহণযোগ্য সমাধান হলো 
`name.clone()` দিয়ে ডেটা clone করে লোকাল কপিটি mutate করা।
"""

[[questions]]
id = "8020e4a2-f0b4-4eae-90ac-a87712d9d00b"
type = "MultipleChoice"
prompt.prompt = """
ধরুন একজন প্রোগ্রামার নিচের function-টি লেখার চেষ্টা করলেন:

```
/// Rounds all the floats in a vector to the nearest integer, in-place
fn round_in_place(v: &Vec<f32>) {
    for n in v {
        *n = n.round();
    }
}
```

Rust compiler নিচের error দিয়ে তাদের কোড বাতিল করে দেয়:

```text
error[E0594]: cannot assign to `*n`, which is behind a `&` reference
 --> test.rs:4:9
  |
3 |     for n in v {
  |              - this iterator yields `&` references
4 |         *n = n.round();
  |         ^^^^^^^^^^^^^^ `n` is a `&` reference, so the data it refers to cannot be written
```

function-টির উল্লিখিত উদ্দেশ্য বিবেচনায়, প্রোগ্রামটির সবচেয়ে Rust-সুলভ সমাধান নিচের কোনটি? 
ওপরের function থেকে পার্থক্যগুলো হাইলাইট করা আছে।
"""
answer.answer = """
```
fn round_in_place(v: `[&mut Vec<f32>]`) {
    for n in v {
        *n = n.round();
    }
}
```
"""
prompt.distractors = [
"""
```
fn round_in_place(v: &Vec<f32>) `[-> Vec<f32>]` {
    `[let mut v2 = Vec::new();]`
    for n in v {
        `[v2.push(n.round());]`
    }
    `[v2]`
}
```
""",
"""
```
fn round_in_place(`[mut v: Vec<f32>]`) {
    for n in v {
        *n = n.round();
    }    
}
```
""",
"""
```
fn round_in_place(v: &Vec<f32>) {
    for `[mut n]` in `[&mut v.clone()]` {
        n = n.round();
    }    
}
```
""",
]
context = """
এই function-এর কাজ যেহেতু একটি vector-কে নিজ জায়গাতেই round করা, তাই একই vector-এর
একটি নতুন কপি return করা (`-> Vec<f32>`) বা vector-টির ownership নিয়ে নেওয়া
(`mut v: Vec<f32>`) Rust-সুলভ হবে না। সবচেয়ে ভালো সমাধান হলো 
type signature `&Vec<f32>` থেকে বদলে `&mut Vec<f32>` করা।
"""
