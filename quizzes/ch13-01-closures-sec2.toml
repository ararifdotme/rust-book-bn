type = "MultipleChoice"
prompt.prompt = """
নিচের API-টি বিবেচনা করুন:

```rust
pub struct Analyzer<F> {
    postprocess: F
}

impl<F: ___(i32) -> i32> Analyzer<F> {
    fn process(&self, n: i32) -> i32 { /* .. */ }
    pub fn pipeline(&self, n: i32) -> i32 {
        let n = self.process(n);
        (self.postprocess)(n)
    }
}
```

ফাঁকা জায়গা পূরণ করতে নিচের কোন function trait সবচেয়ে উপযুক্ত?
"""
answer.answer = "`Fn`"
prompt.distractors = ["`FnMut`", "`FnOnce`"]
context = """
`pipeline` একাধিকবার call হতে পারে, তাই `FnOnce` উপযুক্ত নয়।
`pipeline` `self`-এর একটি immutable reference নেয়; `postprocess` যদি `FnMut` হতো, তাহলে `pipeline`-এর ভেতরে একে call করা যেত না।
তাই এখানে `Fn` সবচেয়ে উপযুক্ত।
"""