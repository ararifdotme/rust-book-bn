id = "0f298680-d870-47a1-962c-1c668f75cb68"
type = "MultipleChoice"
prompt.prompt = """
নিচের API-টি বিবেচনা করুন:

```rust
/// Executes a function with a mutable reference to each element of a vector
fn for_each_mut<T, F: ___(&mut T)>(v: &mut Vec<T>, mut f: F) {
    for x in v.iter_mut() {
        f(x);
    }
}
```

ফাঁকা জায়গা পূরণ করতে নিচের কোন function trait সবচেয়ে উপযুক্ত?
"""
answer.answer = "`FnMut`"
prompt.distractors = ["`Fn`", "`FnOnce`"]
context = """
`f` একাধিকবার call হয়, তাই `FnOnce` উপযুক্ত নয়। `Fn` ও `FnMut` দুটিই কাজ করতে পারে, আর `FnMut` কম কড়া, তাই `FnMut` সবচেয়ে উপযুক্ত।
"""


