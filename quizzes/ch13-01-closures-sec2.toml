type = "Tracing"
prompt.program = """
fn main() {
    let mut s = String::from("Hello");
    let add_suffix = |s: &mut String| s.push_str(" world");
    println!("{s}");
    add_suffix(&mut s);
}
"""
answer.doesCompile = true
answer.stdout = "Hello"
context = """
`add_suffix` যেহেতু `s` capture করে না, তাই `add_suffix` দিয়ে পরিবর্তন করার আগে `s` পড়ায় কোনো সমস্যা নেই।
"""

