[multipart]
q = """
**প্রেক্ষাপট:** আপনি একটি serialization library নকশা করছেন, যা Rust data type-কে JSON-এর মতো format-এ রূপান্তর করে।

**কার্যক্ষমতা:** একটি `Serialize` trait, যা serialize করা যায় এমন type implement করতে পারে, আর একটি `to_json` function, যা serialize করা যায় এমন type-কে JSON-এ রূপান্তর করে।

**নকশা:** কার্যক্ষমতাটি implement করার জন্য নিচে কয়েকটি প্রস্তাবিত নকশা দেওয়া হলো।

```
// Option 1: types serialize to a `Value` enum
pub enum Value {
	String(String),
	Number(isize)
}

pub trait Serialize {
	fn serialize(&self) -> Value;
}

fn value_to_json(value: Value) -> String {
	/* .. */
}

pub fn to_json(data: impl Serialize) -> String {
    let value = data.serialize();
    value_to_json(value)
}


// Option 2: types serialize via calls to a `Serializer` interface
pub trait Serialize {
	fn serialize<S: Serializer>(&self, serializer: &mut S);
}

pub trait Serializer {
	fn serialize_string(&mut self, s: &str);
	fn serialize_number(&mut self, n: isize);
}

struct JsonSerializer { buffer: String };
impl Serializer for JsonSerializer {
	/* .. */
}

pub fn to_json(data: impl Serialize) -> String {
	let mut serializer = JsonSerializer { buffer: String::new() };
	data.serialize(&mut serializer);
	serializer.buffer
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:** `Serialize` trait-এর বিদ্যমান implementation-এর কোড না বদলেই একটি নতুন data format যোগ করা সম্ভব হওয়া উচিত।
"""
prompt.distractors = []
prompt.sortAnswers = true
answer.answer = ["1", "2"]
context = """
দুটি নকশাই যথেষ্ট বিচ্ছিন্ন, ফলে প্রতিটি নতুন data format যেকোনো `Serialize` implementation থেকে স্বাধীন। Option 1-এ
প্রতিটি data format একটি `Value`-কে সেই format-এর রূপে রূপান্তর করে। `Value` একটি module-এর সীমানা হিসেবে কাজ করে।

Option 2-এ serialize করা মানের কোনো স্পষ্ট মধ্যবর্তী রূপ নেই, বরং প্রতিটি `Serialize` implementation `Serializer` implement করা যেকোনো
`S`-এর ওপর স্পষ্টভাবে generic।
"""
id = "66e036c9-91a0-4611-8110-967b5ed1a514"

