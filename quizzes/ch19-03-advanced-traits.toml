type = "MultipleChoice"
prompt.prompt = """
`Add` trait-এর সংজ্ঞাটি মনে করুন:

```
trait Add<Rhs=Self> {
    type Output;
    fn add(self, rhs: Rhs) -> Self::Output;
}
```

`Rhs` কেন `add` function-এর নয়, বরং `Add` trait-এর type parameter, তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে? অর্থাৎ `Add` কেন এভাবে নকশা করা হয়নি:

```
trait Add {
    type Output;
    fn add<Rhs>(self, rhs: Rhs) -> Self::Output;
}
```
"""
answer.answer = "`Rhs` function-স্তরের type parameter হলে `add`-এর সংজ্ঞা `Rhs`-এর কোনো গঠন ধরে নিতে পারত না"
prompt.distractors = [
    "`Rhs` function-স্তরের চেয়ে trait-স্তরের type parameter হলে type-checker বেশি দক্ষভাবে চলে",
    "function-স্তরের type parameter হিসেবে `Rhs`-এর default type থাকতে পারে না",
    "function-স্তরের type parameter-এর কারণে `add` function-এর কোড তৈরিতে monomorphization-এর জন্য বাড়তি সময় লাগত"
]
context = """
এমন নকশা খুব একটা অর্থবহ হতো না, কারণ `add<Rhs>`-এর কাছে `Rhs`-এর গঠন সম্পর্কে কোনো তথ্য
থাকত না, তাই এভাবে কোনো অর্থবহ যোগের function implement করা অসম্ভব হতো।
"""

