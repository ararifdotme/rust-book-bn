struct Point<T> { x: T, y: T }

impl Point<i32> {
  fn f(&self) -> &i32 { &self.y }
}

impl<T> Point<T> {
  fn f(&self) -> &T { &self.x }
}

fn main() {
  let p: Point<i32> = Point { x: 1, y: 2 };
  println!("{}", p.f());
}
"""
answer.doesCompile = false
answer.lineNumber = 8
context = """
`f`-এর এই সংজ্ঞাগুলো পরস্পরবিরোধী, আর `p.f()` call করলে কোন `f` ব্যবহার করা উচিত, Rust-এর পক্ষে তা নির্ধারণ করার কোনো উপায় নেই। তাই এটি একটি compiler error।
"""
