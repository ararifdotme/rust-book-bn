[[questions]]
id = "0aad53ff-89d7-4d14-8e3d-c17809220252"
type = "ShortAnswer"
prompt.prompt = """
ধরুন আপনি third-party (অন্যের লেখা) একটি function ব্যবহার করছেন, যার implementation আপনি জানেন না, কিন্তু যার type signature এই:

```
fn mystery<T>(x: T) -> T {
  // ????
}
```

তারপর আপনি `mystery` এভাবে call করলেন:

```
let y = mystery(3);
```

ধরে নিন `mystery` কোনো unsafe কোড ব্যবহার করে না, তাহলে `y`-এর মান অবশ্যই হবে :
"""
answer.answer = "3"
context = """
(unsafe কোড ছাড়া) `T -> T` signature-যুক্ত একমাত্র সম্ভাব্য function হলো identity function (input-কেই হুবহু ফেরত দেয় এমন function):

```
fn mystery<T>(x: T) -> T {
  x
}
```

function-টি অবশ্যই panic করতে বা কিছু print করতে পারে, কিন্তু return মান শুধু input-টিই হতে পারে। `mystery` জানে না
`T` কোন type, তাই `mystery`-এর পক্ষে `T`-এর কোনো মান তৈরি বা পরিবর্তন করার কোনো উপায় নেই।
এই ধারণার আরও উদাহরণের জন্য [Theorems for free!](https://dl.acm.org/doi/pdf/10.1145/99370.99404) দেখুন।

**3-ই আসলে সঠিক উত্তর! উত্তরের সঙ্গে একমত না হলে দয়া করে bug report জমা দেবেন না!**
"""

