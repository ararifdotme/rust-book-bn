[[questions]]
id = "05a7959b-4fe7-4ee6-9c25-bfa9a4e72535"
type = "MultipleChoice"
prompt.prompt = """
একটি `unsafe` block-এর ভেতরে Rust কোন কোন "অতিমানবীয় ক্ষমতা" চালু করে?
"""
answer.answer = [
    "একটি raw pointer dereference করা",
    "`unsafe` হিসেবে চিহ্নিত একটি function call করা",
]
prompt.distractors = [
    "borrow checker নিষ্ক্রিয় করা",
    "একটি reference-কে raw pointer-এ রূপান্তর করা",
]
context = """
`unsafe` block আপনাকে raw pointer dereference করতে আর `unsafe` function call করতে দেয়। তবে
`unsafe` borrow checker নিষ্ক্রিয় করে না (নিরাপদ reference-এর ওপর operation তবুও যাচাই হয়)।
সাধারণ নিরাপদ কোডেই একটি reference-কে raw pointer-এ রূপান্তর করা যায়।
"""


[[questions]]
id = "7d50567d-d73c-47d4-922f-480e8d1b7919"
type = "Tracing"
prompt.program = """
fn main() {
    let mut v = Vec::with_capacity(4);
    for i in 0 .. 3 { 
        v.push(i); 
    }
    let n = &raw const v[0];
    v.push(4);
    println!("{}", unsafe { *n });
}
"""
answer.doesCompile = true
answer.stdout = "0"
context = """
এই প্রোগ্রাম বিপজ্জনক! এটি ঠিকমতো compile হয় এবং কোনো সমস্যা ছাড়াই চলে,
কারণ `Vec`-এর যথেষ্ট ধারণক্ষমতা আছে, ফলে `v.push(4)` এর আকার বদলায় না। কিন্তু
ধারণক্ষমতা 3 হলে `n` deallocate হওয়া মেমোরিকে নির্দেশ করত।
"""

[[questions]]
id = "015941ed-d375-4070-a8dc-2f368584b302"
type = "MultipleChoice"
prompt.prompt = """
নিচের কোন পরিস্থিতিগুলোতে `unsafe` কোড (বা `unsafe` কোডের চারপাশে একটি নিরাপদ মোড়ক) ব্যবহার 
borrow checker-এর সীমাবদ্ধতা এড়ানোর একটি idiomatic উপায়?
"""
answer.answer = [    
    "একটি array-র আলাদা আলাদা (একে অপরের সঙ্গে না মেশা) index-এর দুটি mutable reference পাওয়া",
    "পড়া না হলে মানগুলোকে প্রাথমিক মান ছাড়া থাকতে দেওয়া",
    "একটি struct-এর এক field-এর reference একই struct-এর আরেকটি field-এ রাখা"
]
prompt.distractors = [
    "একটি function থেকে stack-এ allocate করা একটি variable-এর pointer বাইরে return করা",    
]
context = """
আলাদা index-এর দুটি mutable reference যুক্তিসঙ্গত, কারণ index-গুলো কখন আলাদা তা borrow checker বোঝে না। দেখুন: [`slice::split_at_mut`](https://doc.rust-lang.org/stable/std/primitive.slice.html#method.split_at_mut)।

মানগুলোকে প্রাথমিক মান ছাড়া থাকতে দেওয়া যুক্তিসঙ্গত, কারণ borrow checker একটি রক্ষণশীল নীতি নেয় যে মান সবসময় প্রাথমিক মানসহ থাকতে হবে, কিন্তু কখনো কখনো প্রাথমিক মান ছাড়া মান নিয়ে কাজ করা কাজে লাগে। দেখুন [`MaybeUninit`](https://doc.rust-lang.org/stable/std/mem/union.MaybeUninit.html) আর [`take_mut`](https://docs.rs/take_mut/0.2.2/take_mut/index.html) crate।

একটি struct-কে দিয়ে নিজেরই reference রাখানো যুক্তিসঙ্গত, কারণ borrow checker নিজের দিকে reference-এর lifetime নিয়ে
যুক্তি দিয়ে বিচার করতে পারে না। দেখুন [`std::pin`](https://doc.rust-lang.org/stable/std/pin/index.html) module।

তবে stack-এ allocate করা একটি variable-এর pointer return করা unsafe কোড দিয়েও *কখনো* বৈধ
নয়। একমাত্র উপযুক্ত বিকল্প হলো garbage collection (স্বয়ংক্রিয় মেমোরি পুনরুদ্ধার) ব্যবহার করা, যেমন `&T`-এর বদলে
একটি `Rc<T>` return করা।
"""