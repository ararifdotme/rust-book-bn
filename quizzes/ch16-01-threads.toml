id = "53cb3740-2962-4379-a25f-a65e72812a95"
type = "Tracing"
prompt.program = """
use std::thread;
fn main() {
    let mut n = 1;
    let t = thread::spawn(move || {
        n = n + 1;
        thread::spawn(move || {
            n = n + 1;
        })
    });
    n = n + 1;
    t.join().unwrap().join().unwrap();
    println!("{n}");
}
"""
answer.doesCompile = true
answer.stdout = "2"
context = """
`move` keyword-এর কারণে `n` closure-এর ভেতরে copy হয়, তাই `thread::spawn`-এর ভেতরের
`n = n + 1` assignment-গুলো বাইরের `n`-এর ওপর কোনো প্রভাব ফেলে না।
"""

