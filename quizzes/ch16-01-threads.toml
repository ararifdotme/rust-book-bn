id = "c2a84e6d-8143-4944-bf20-b00e49144ac9"
type = "MultipleChoice"
prompt.prompt = """
পাঠ্যের এই উদাহরণটি বিবেচনা করুন, যেখানে একটি thread একটি vector অনুচিতভাবে capture করে:

```
use std::thread;

fn main() {
    let v = vec![1, 2, 3];

    let handle = thread::spawn(|| {
        println!("Here's a vector: {:?}", v);
    });

    handle.join().unwrap();
}
```

Rust compiler এই diagnostic (সমস্যার বিবরণ) দেয়:

```text
note: function requires argument type to outlive `'static`
 --> src/main.rs:6:18
  |
6 |       let handle = thread::spawn(|| {
  |  __________________^
7 | |         println!("Here's a vector: {:?}", v);
8 | |     });
  | |______^
```

মনে করুন, `'static` হলো সেই reference-এর lifetime, যা পুরো প্রোগ্রামের সময় জুড়ে বৈধ থাকে।

"function requires argument type to outlive `'static`" note-টি নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "একটি thread কতক্ষণ চলবে Rust তা জানে না, তাই thread-এর capture করা মানগুলোকে চিরকাল বাঁচতে হবে"
prompt.distractors = [
    "`thread::spawn`-এ পাঠানো closure-এর কোনো argument নেওয়ার অনুমতি নেই",
    "`v` vector-এ এমন মান আছে যা `'static`-এর চেয়ে বেশি সময় বাঁচে না",
    "একটি closure শুধু `&'static str` type-এর string constant capture করতে পারে"
]
context = """
একটি closure যদি এমন একটি মানের reference capture করে যা `'static`-এর চেয়ে কম সময় বাঁচে, তাহলে thread-টি মানটির চেয়ে বেশি সময় 
বেঁচে থেকে memory safety ভঙ্গ করতে পারে। খেয়াল করুন, [`thread::scope`](https://doc.rust-lang.org/std/thread/fn.scope.html) 
ব্যবহার করে thread-এর lifetime স্থিরভাবে সীমিত করে thread-কে non-static reference capture করতে দেওয়া যায়।
"""