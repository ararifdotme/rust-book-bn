type = "MultipleChoice"
prompt.prompt = "`Result<T, E>` type-এর যেকোনো একটি expression `e` দেওয়া থাকলে, `e?` কীভাবে রূপান্তরিত হয়, তা কোন কোড-অংশটি সবচেয়ে ভালোভাবে প্রকাশ করে?"
answer.answer = """
```
match e {
  Ok(x) => x,
  Err(err) => { return Err(err); }
}
```
  """
prompt.distractors = [
  """
```
if let Err(err) = e {
  return Err(err);
}
```
  """,
  """
```
e.unwrap()
```
  """,
  """
```
match e {
  Ok(x) => x,
  Err(err) => panic!("{err}")
}
```
  """,
]
context = """
`e` যদি একটি `Result` হয়, তাহলে `e?` সম্ভব হলে `Ok`-এর ভেতরের মানটি বের করে আনে, অন্যথায় বর্তমান function থেকে `Err`-টি return করে।
"""

[[questions]]
id = "0ea46358-f560-4d3e-85d2-a1806eb7c797"
type = "Tracing"
prompt.program = """
// assume hello.txt has the contents "will"

fn read_username_from_file() -> Option<String> {
  let mut username_file = File::open("hello.txt")?;
  let mut username = String::new();
  username_file.read_to_string(&mut username)?;
  Some(username)
}

fn main() {
  println!("{}", read_username_from_file().unwrap()); 
}
"""
answer.doesCompile = false
answer.lineNumber = 4
context = """
`File::open` একটি `Result` return করে, কিন্তু `read_username_from_file`-এর return type একটি `Option` আশা করে। তাই `Result`-কে একটি `Option`-এ
রূপান্তর না করা পর্যন্ত (যেমন `Result::ok` method দিয়ে) `?` operator ব্যবহার করা অবৈধ।
"""