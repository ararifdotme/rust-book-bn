[[questions]]
id = "7e4eeb62-55c2-443b-a8cc-fba060501245"
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনি `foobar v0.1.0` নামের একটি library প্রকাশ করছেন। `cargo publish` চালানোর পর বুঝলেন আপনার একটি function-এ
বাগ আছে। একই `v0.1.0` version-এ প্রকাশিত crate কীভাবে overwrite করবেন, তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "একটি নির্দিষ্ট version-এ প্রকাশিত crate overwrite করা অসম্ভব"
prompt.distractors = [
    "`cargo publish` command-এ `--overwrite-published` flag যোগ করা",
    "Crates.io-তে log in করে প্রকাশিত crate-এর `v0.1.0` মুছে ফেলা",   
    "`cargo yank` চালিয়ে তারপর `cargo publish` চালানো"
]
context = """
Crates.io প্রকাশিত version overwrite করতে দেয় না। এমন পরিস্থিতিতে সবচেয়ে ভালো উপায় হলো বাগযুক্ত version yank করা
এবং তারপর `v0.1.1`-এর মতো একটি নতুন version প্রকাশ করা।
"""

