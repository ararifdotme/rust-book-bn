    "Crates.io-তে নিবন্ধিত নয় এমন একটি crate নাম বেছে নেওয়া"
]
context = """
public function-এ documentation যোগ করা অবশ্যই উচিত, তবে default-ভাবে বাধ্যতামূলক নয়। খেয়াল করুন, আপনি যদি
চান Rust documentation-হীন কোডকে error হিসেবে গণ্য করুক, তাহলে আপনার library-র root-এ এই statement যোগ করতে পারেন:

```
#![deny(missing_docs)]
