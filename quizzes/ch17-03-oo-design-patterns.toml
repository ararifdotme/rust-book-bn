type = "MultipleChoice"
prompt.prompt = """
এই অংশের চলমান উদাহরণে একটি blog post তিনটি অবস্থার একটিতে থাকতে পারত: `Draft`, `PendingReview` আর `Published`। উদাহরণে প্রতিটি অবস্থা একটি struct হিসেবে, আর অবস্থার বদল trait object return করা trait method হিসেবে প্রকাশ করা হয়েছিল।

একটি বিকল্প implementation অবস্থাগুলোকে একটি enum হিসেবে প্রকাশ করতে পারত, এভাবে:

```
enum BlogState {
    Draft,
    PendingReview,
    Published
}

impl Post {
    fn request_review(&mut self) {
        use BlogState::*;
        self.state = match self.state {
            Draft => PendingReview,
            PendingReview => PendingReview,
            Published => Published
        }
    }
}
```

enum রূপের চেয়ে struct/trait রূপ পছন্দ করার ভালো কারণ নিচের কোনগুলো?
"""
answer.answer = [
    "API-র একজন ব্যবহারকারী system-এ একটি নতুন অবস্থা যোগ করতে পারত",
    "নতুন অবস্থা যোগ করতে অন্য প্রতিটি অবস্থার method পরিবর্তন করতে হয় না"
]
prompt.distractors = [
    "runtime-এ `match`-এর ব্যবহার dynamic dispatch-এর চেয়ে ধীর",
    "API-র একজন ব্যবহারকারী system-এর সব অবস্থার জন্য একটি নতুন method যোগ করতে পারত"
]
context = """
struct/trait পদ্ধতি এই অর্থে বাড়ানো যায় যে API-র একজন ব্যবহারকারী মূল API-র কার্যক্ষমতা না বদলেই
একটি নতুন অবস্থা (যেমন `Retracted`) তৈরি করতে পারে। এই অবস্থা যোগ করার সময়
অন্য অবস্থার method বদলাতে হয় না। অন্যদিকে enum-এর ক্ষেত্রে
একজন ব্যবহারকারী enum-এ নতুন শাখা যোগ করতে পারে না। তা ছাড়া একটি অবস্থা যোগ করলে
সব `match` expression হালনাগাদ করতে হয়।

একটি `match` dynamic dispatch-এর চেয়ে ধীর হওয়ার সম্ভাবনা কম। match হলো একটি enum-এর tag-এর ভিত্তিতে
একটি সরল শাখা, অন্যদিকে dynamic dispatch-এর জন্য একটি trait object-এর virtual table দিয়ে
inline না করা function call-সহ এক স্তরের indirection দরকার।

struct/trait পদ্ধতিতে API-র একজন ব্যবহারকারী বিদ্যমান অবস্থাগুলোর জন্য নতুন *method* যোগ করতে পারে না, 
শুধু নতুন অবস্থা যোগ করতে পারে। method-গুলো API-র লেখকের trait-এর সংজ্ঞায় নির্দিষ্ট। খেয়াল করুন, extension trait দিয়ে এমন একটি নতুন method যোগ করা যায়, যা শুধু বিদ্যমান method-এর ওপর ভিত্তি করে তৈরি, যেমন:

```
trait StateExt {
    fn request_review_twice(self: Box<Self>) -> Box<dyn State>;
}

impl<S: State> StateExt for S {
    fn request_review_twice(self: Box<Self>) -> Box<dyn State> {
        self.request_review().request_review()
    }
}
```

তবে এই extension-গুলো অবস্থাগুলোর private ডেটা পড়তে পারে না।
"""