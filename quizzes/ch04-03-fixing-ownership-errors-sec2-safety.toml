id = "512e1ec0-cd7b-4a90-949b-d7b08b4009a8"
type = "MultipleChoice"
prompt.prompt = """
নিচের কোড-অংশটি compile হয় না:

```rust
let s = String::from("Hello world");
let s_ref = &s;
let s2 = *s_ref;
println!("{s2}");
```

এই প্রোগ্রামটিকে চলতে দিলে যে undefined behavior ঘটতে পারত, তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "প্রোগ্রামের শেষে string-টি দুবার free হয়"
prompt.distractors = [
  "`println`-এ `s2` পড়া মানে free করা মেমোরি ব্যবহার করা",
  "`*s_ref` dereference মানে free করা মেমোরি ব্যবহার করা",
  "এই প্রোগ্রামে কোনো undefined behavior নেই"
]
context = """
`println` প্রযুক্তিগতভাবে নিরাপদ, কারণ বর্তমান scope শেষ না হওয়া পর্যন্ত string-টি
deallocate হবে না। কিন্তু তারপর undefined behavior ঘটে, যখন `s` আর `s2`-এর হয়ে
string-টি দুবার free হয়।
"""

[[questions]]
id = "1e31e163-5bd4-4385-b222-33c19058bf6a"
type = "MultipleChoice"
prompt.prompt = """
নিচের প্রোগ্রামটি compile হয় না:

```rust
fn copy_to_prev(v: &mut Vec<i32>, i: usize) {
  let n = &mut v[i];
  *n = v[i - 1];
}
fn main() {
  let mut v = vec![1, 2, 3];
  copy_to_prev(&mut v, 1);
}
```

এই প্রোগ্রামটিকে চলতে দিলে যে undefined behavior ঘটতে পারত, তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "এই প্রোগ্রামে কোনো undefined behavior নেই"
prompt.distractors = [
  "`*n` assignment মানে free করা মেমোরি ব্যবহার করা",
  "`&mut v[i]` borrow free করা মেমোরির একটি pointer তৈরি করে",
  "`v[i - 1]` পড়া মানে free করা মেমোরি ব্যবহার করা"
]
context = """
এই প্রোগ্রামটি নিরাপদ। এটি চালালে কোনো undefined behavior ঘটত না। (`i` যদি `v`-এর সীমার
বাইরে হতো, তাহলে Rust undefined behavior ঘটানোর বদলে runtime-এ panic করত।)

সমস্যা হলো, `v[i]` আর `v[i - 1]` যে আলাদা উপাদান নির্দেশ করছে, তা Rust নিশ্চিতভাবে জানে না।
"""


[[questions]]
id = "4df75888-2cd5-4259-8629-46a307429fd0"
type = "MultipleChoice"
prompt.prompt = """
আগের কুইজের function-টির একটি সরলীকৃত রূপ, এই function-টি দেখুন:

```
/// Adds "Ph.D." to a person's name
fn award_phd(name: &String) {
    let mut name = *name;
    name.push_str(", Ph.D.");
}
```

Rust compiler নিচের error দিয়ে এই function বাতিল করে দেয়:

```text
error[E0507]: cannot move out of `*name` which is behind a shared reference
 --> test.rs:3:20
  |
3 |     let mut name = *name;
  |                    ^^^^^
  |                    |
  |                    move occurs because `*name` has type `String`, which does not implement the `Copy` trait
  |                    help: consider borrowing here: `&*name`
```

ধরে নিন, compiler এই function বাতিল **করেনি**। নিচের প্রোগ্রামগুলোর মধ্যে চালালে যেগুলো (যদি থাকে)
undefined behavior ঘটাতে পারে, সেগুলোর প্রতিটি বেছে নিন। কোনো প্রোগ্রামই undefined behavior ঘটাতে না পারলে 
"এগুলোর কোনোটিই নয়" বেছে নিন।
"""
answer.answer = [
"""
```
let name = String::from("Ferris");
award_phd(&name);
```
""",
"""
```
let name = String::from("Ferris");
award_phd(&name);
println!("{}", name);
```
""",
"""
```
let name = String::from("Ferris");
let name_ref = &name;
award_phd(&name);
println!("{}", name_ref);
```
""",

]
prompt.distractors = [
  "এগুলোর কোনোটিই নয়"
]
context = """
`let mut name = *name` statement-এর ফলে `name` ইনপুট string-এর ownership নিয়ে নেয়।
কিন্তু caller-ও তখনো string-টির ownership ধরে রাখে। তাই `award_phd`
শেষ হওয়ার পর string-টি deallocate হয়। ফলে ওপরের প্রতিটি প্রোগ্রামেই undefined behavior আছে, 
কারণ শেষ পর্যন্ত `name` দ্বিতীয়বার deallocate হবে। `award_phd` call করার পর `name`
নাকি `name`-এর কোনো reference পড়া হলো, তাতে কিছু যায় আসে না।
"""

