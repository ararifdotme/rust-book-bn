id = "1f48fda5-afc6-440b-a9aa-53dc8d54efaa"
type = "Tracing"
prompt.program = """
fn main() {
    let mut point = [0, 1];
    let mut x = point[0];
    let y = &mut point[1];
    x += 1;
    *y += 1;
    println!("{} {}", point[0], point[1]);
}
"""
answer.doesCompile = true
answer.stdout = "0 2"
context = """
এই প্রোগ্রামটি compile হয়, কারণ `x`-এর binding `point[0]` কপি করে, ফলে `y` `point[1]`-কে mutable-ভাবে borrow করতে পারে।
`x += 1` mutation `point`-কে প্রভাবিত করে না, কিন্তু `*y += 1` mutation করে, তাই চূড়ান্ত ফলাফল `0 2`।
"""