id = "5dcd923f-13a4-4181-b252-4b580547249f"
type = "Tracing"
prompt.program = """
fn main() {
    let x = (0, 1);
    match x {
        (_, y) if y == 0 => println!("A"),
        (0, _) => println!("B"),
        _ => println!("C")
    }
}
"""
answer.doesCompile = true
answer.stdout = "B"
context = """
প্রথম শাখা `y = 1`-এর সঙ্গে মেলায়, অর্থাৎ `y != 0`, তাই pattern ব্যর্থ হয়।
দ্বিতীয় শাখার শর্ত `x == 0`, যা সত্য, তাই pattern সফল হয়।
"""

[[questions]]
id = "ac0045c7-981a-46cb-baeb-adaa533804ad"
type = "MultipleChoice"
prompt.prompt = """
নিচের প্রোগ্রামটি বিবেচনা করুন:

```
let a = [(0, 1)];
let ?? = a;
```

`??` placeholder-এর জায়গায় বসানো যায় এমন বৈধ pattern নিচের কোনগুলো?
"""
answer.answer = [
    "`_`",
    "`[(n, ..)]`",
    "`[..]`"
]
prompt.distractors = [
    "`(_, n)`"
]
context = """ 
`(_, n)` pattern বৈধ নয়, কারণ `a` হলো tuple-এর একটি array, নিজে কোনো tuple নয়।
"""

