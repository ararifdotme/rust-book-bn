[[questions]]
id = "a7d38ffa-66b2-472a-90a5-b026b28ad3df"
type = "MultipleChoice"
prompt.prompt = """
ধরুন আমাদের এই সংজ্ঞার একটি `Point` type আছে:

```
struct Point {
    x: i32,
    y: i32
}
```

নিচের pattern-টি দেওয়া থাকলে:

```
Point { x: x @ 0 ..= 5, y } if x + y != 0
```

নিচের কোন মানগুলো এই pattern-এর সঙ্গে মিলবে?
"""
answer.answer = [
    "`Point { x: 5, y: -4 }`",
    "`Point { x: 0, y: 1 }`",
]
prompt.distractors = [
    "`Point { x: -1, y: 2 }`",
    "`Point { x: 3, y: -3 }`"
]
context = """
এই pattern বলে দেয় যে `x`-কে 0 থেকে 5-এর মধ্যে (দুই প্রান্তসহ) হতে হবে, এবং `x + y != 0`।
তাই `(5, -4)` আর `(0, 1)` বৈধ, কিন্তু `(-1, 2)` আর `(3, -3)` নয়।
"""
