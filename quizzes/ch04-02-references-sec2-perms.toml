[[questions]]
id = "2e273ac2-6f06-4c19-a831-1d44eed89323"
type = "MultipleChoice"
prompt.prompt = """
নিচের প্রোগ্রামের permission-গুলো দেখুন:

```aquascope,permissions,stepper
#fn main() {
let mut s = String::from("Hello");
let t = &mut s;
/* here */
t.push_str(" world");
println!("{}", s);
#}
```

`/* here */` চিহ্নিত জায়গায় path `s`-এর permission কী কী? নিচের প্রতিটি permission বেছে নিন, অথবা path-টির কোনো permission না থাকলে 
"কোনো permission নেই" বেছে নিন।
"""
answer.answer = ["কোনো permission নেই"]
prompt.distractors = ["R", "W", "O"]
prompt.answerIndex = 3
context = """
`t` সক্রিয় থাকা অবস্থায় mutable borrow `t = &mut s` `s`-এর সব permission সরিয়ে নেয়।
"""

[[questions]]
id = "b431f43e-9a6f-4715-ae88-8896fca6ff3b"
type = "MultipleChoice"
prompt.prompt = """
নিচের প্রোগ্রামের permission-গুলো দেখুন:

```aquascope,permissions,stepper,boundaries
fn get_first(v: &Vec<String>) -> &String {
    &v[0]
}

fn main() {
    let mut strs = vec![
        String::from("A"), String::from("B")
    ];
    let first = get_first(&strs);
    if first.len() > 0 {
        strs.push(String::from("C"));
    }
}
```

`strs` কেন write permission হারায় এবং আবার ফিরে পায়, তা নিচের কোনটি সবচেয়ে ভালোভাবে ব্যাখ্যা করে?
"""
answer.answer = "`get_first` `strs`-এর ভেতরের ডেটার একটি immutable reference return করে, তাই `first` সক্রিয় থাকা অবস্থায় `strs`-এ লেখা যায় না"
prompt.distractors = [
  "`get_first`-এ পাঠানো immutable reference `&strs` সক্রিয় থাকা অবস্থায় `strs`-এ লেখা যায় না",
  "`strs.push(..)` operation-এর আগে `strs`-এর write permission দরকার নেই, তাই শুধু ওই statement-এ এটি write permission ফিরে পায়",
  "`first` যেহেতু `strs`-কে নির্দেশ করে, তাই `strs` শুধু if-statement-এর মতো ভেতরের কোনো scope-এ mutate করা যায়"
]
context = """
`get_first` call হলে Rust বুঝতে পারে যে return হওয়া string `first` `strs`-এর ভেতরের ডেটাকে নির্দেশ করতে পারে, তাই `strs` 
write permission হারায়। `first` variable আর ব্যবহার না হলে (if-এর শর্তের পরে) `strs` আবার write permission ফিরে পায়।
"""

[[questions]]
id = "652e596c-7cc9-42e6-a7f8-701879cd9a2b"
type = "MultipleChoice"
prompt.prompt = """
এই অনিরাপদ প্রোগ্রামটি দেখুন:
```aquascope,interpreter,shouldFail
#fn main() {
let v1 = vec![1, 2, 3];
let mut v2 = v1;
v2.push(4);
println!("{}", v1[0]);`[]`    
#}
```

এই প্রোগ্রামে ঠিক কোন জায়গায় undefined behavior ঘটে, তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "`v1[0]` `v1` পড়ে, যা deallocate হওয়া মেমোরিকে নির্দেশ করে"
prompt.distractors = [
  "heap-এর vector ডেটার owner `v2`, `v1` নয়",
  "লাইন 2-এ `v1` `v2`-তে move হয়েছে",
  "লাইন 3-এর `push` `v1`-এর pointer অবৈধ করে দিয়েছে"
]
context = """
undefined behavior ঘটে, কারণ free হওয়ার পর `v1` পড়া হয়। লক্ষ করুন, বাকি তিনটি বিকল্পও প্রোগ্রামটি সম্পর্কে সঠিক বক্তব্য,
কিন্তু undefined behavior আসলে কেন ঘটে, তা ব্যাখ্যা করে না। যেমন, `println` মুছে দিলেও
বাকি তিনটি বিকল্প সত্য থাকে, কিন্তু প্রোগ্রামটিতে আর undefined behavior থাকে না।
"""