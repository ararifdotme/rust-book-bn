prompt.distractors = [ "মিথ্যা" ]
context = """
প্রথম if-expression-টি দ্বিতীয় if-statement-এর আচরণ প্রকাশের আরও সংক্ষিপ্ত একটি উপায়।

লক্ষ করুন, দ্বিতীয় কোড-অংশে `x`-কে শুরুতে `let mut` দিয়ে ঘোষণা করা Rust-এর কাছে **বাধ্যতামূলক নয়**।
