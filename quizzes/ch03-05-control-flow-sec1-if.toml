prompt.prompt = """
সত্য/মিথ্যা: এই দুটি কোড-অংশ চালালে `x`-এর মান একই হয়।

কোড-অংশ 1:
```
let x = if cond { 1 } else { 2 };
```

কোড-অংশ 2:
```
let x;
if cond {
  x = 1;
} else {
  x = 2;
}
```

(দ্রষ্টব্য: দুটি কোড-অংশই compile হয়!)
"""
