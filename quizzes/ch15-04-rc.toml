[[questions]]
id = "3b43eb45-3400-4555-b605-9ae1cde7c80c"
type = "Tracing"
prompt.program = """
use std::rc::Rc;
struct Example;
impl Drop for Example {
    fn drop(&mut self) {
        println!("drop");
    }
}
fn main() {
    let x = Rc::new(Example);    
    let y = Rc::clone(&x);    
    println!("A");
    drop(x);
    println!("B");
    drop(y);    
    println!("C");
}
"""
answer.doesCompile = true
answer.stdout = """
A
B
drop
C
"""
context = """
reference-counted pointer-এর ভেতরের মান মাত্র একবারই drop হয়, তাই "drop" মাত্র একবার print হয়।
প্রথম `drop(x)` reference count কমায়, কিন্তু মানটি drop করে না, কারণ `y` তখনো জীবিত।
তারপর `y` drop করার সময় দেখা যায় reference count 0, তাই `Example` drop হয়।
"""