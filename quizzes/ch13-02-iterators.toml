[[questions]]
id = "19eac65e-44ad-4349-9632-47bdbb519d46"
type = "MultipleChoice"
prompt.prompt = """
সত্য/মিথ্যা: `iter` একটি iterator হলে এই দুটি কোড-অংশের অর্থ একই।

কোড-অংশ 1:
```
while let Some(x) = iter.next() {
    f(x);
}
```

কোড-অংশ 2:
```
for x in iter {
    f(x);
}
```
"""
answer.answer = "সত্য"
prompt.distractors = ["মিথ্যা"]
context = """
for-loop হলো `while let`-এর syntax sugar, আর সেটি নিজেও `loop` ও `break`-এর sugar।
"""

[[questions]]
id = "ff652580-b487-4379-bd70-652f5803321d"
type = "Tracing"
prompt.program = """
fn main() {
    let v = vec![1, 2, 3, 4];
    let a: Vec<_> = v.iter().filter(|x: &&i32| *x % 2 == 0).map(|x: &i32| x * 2).collect();
    let b: Vec<_> = v.iter().map(|x: &i32| x * 2).filter(|x: &i32| x % 2 == 0).collect();
    println!("{} {}", a[0], b[0]);
}
"""
answer.doesCompile = true
answer.stdout = "4 2"
context = """
iterator-এর ক্রম গুরুত্বপূর্ণ &mdash; আগে filter তারপর map আর আগে map তারপর filter এক নয়!

হয়তো ভাবছেন, প্রথম filter কেন `*x` ব্যবহার করে আর দ্বিতীয় filter কেন করে না। 
`v.iter()` একটি `Iterator<Item = &i32>` তৈরি করে। `.filter()` call input হিসেবে একটি `Iterator<Item = T>` নেয়,
এবং তার predicate (শর্ত যাচাই করা closure)-এ `&T` পাঠায়। তাই লাইন 3-এ `x: &&i32`। Rust standard library বাম পাশে `&i32`-এর জন্য
ভাগশেষ operator `%` implement করে ([docs দেখুন](https://doc.rust-lang.org/std/ops/trait.Rem.html#impl-Rem%3Ci32%3E-for-%26'a+i32)),
কিন্তু `&&i32`-এর জন্য নয়। তাই `*x % 2` expression-এ ব্যবহার করতে `x`-কে একবার dereference করতে হয়।

বিপরীতে লাইন 4-এ, `.map()` যখন input হিসেবে একটি `Iterator<Item = T>` নেয়, তখন এটি তার closure-এ `T` পাঠায়।
তাই `map`-এর closure input হিসেবে `&i32` নেয়। গুণ operator `*` `&i32`-এর জন্য implement করা আছে,
তাই `x * 2`-এ `x`-কে dereference করতে হয় না। `x * 2` operation `i32` type-এর একটি মান তৈরি করে, তাই
map-এর ফল হলো একটি `Iterator<Item = i32>`। তারপর `filter` নেয় `x : &i32`, যার জন্যও `x % 2` করতে
dereference লাগে না। এবার জানলেন!
"""
