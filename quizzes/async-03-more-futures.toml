[[questions]]
type = "MultipleChoice"
prompt.prompt = """
প্রদত্ত সময় ধরে sleep করে এমন একটি function `sleep(d)` দেওয়া থাকলে, এই function-টি বিবেচনা করুন:

```rust
let futs: Vec<_> = [1, 2, 3].iter().map(|n| async move {
  sleep(Duration::from_secs(5)).await;
  n + 1
}).collect();

for fut in futs {
  let n = fut.await;
  println!("{n}");
}
```

চালালে এটি শেষ হতে মোটামুটি কত সেকেন্ড লাগার কথা?
"""
prompt.distractors = ["5", "0"]
answer.answer = "15"
context = """
`join_all`-এর মতো কোনো function ব্যবহার না করলে future-গুলো concurrent-ভাবে চলবে না। তাই এই কোডে 15 সেকেন্ড লাগবে (তালিকার প্রতিটি উপাদানের জন্য 5 সেকেন্ড)।
"""
id = "68680e2e-7a9f-4cee-8080-70e57fe5a2b3"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
ধরুন আপনি নিচের বিবরণ অনুযায়ী একটি সহায়ক function নকশা করছেন:

> `map_stringify` দুটি argument নেয়: input-এর একটি vector, আর একটি async function যা input-কে output-এ রূপান্তর করে,
> যেখানে output-গুলোকে string-এ রূপান্তর করা যায়।
> `map_stringify` string-এ রূপান্তরিত output-গুলোর একটি vector return করে।

কোন function type signature এই বিবরণ সবচেয়ে ভালোভাবে প্রকাশ করে?
"""
prompt.distractors = [
"""
```rust
async fn map_stringify(
  inputs: Vec<String>, f: impl Future<Output = String>
) -> Vec<String>
```
""",
"""
```rust
fn map_stringify<I, O, F>(
  inputs: Vec<I>, f: impl Fn(I) -> O,
) -> Vec<impl Future<Output = String>>
where
  O: ToString,  
```
""",
"""
```rust
async fn map_stringify<I, F>(
  inputs: Vec<I>, f: impl Fn(I) -> F, 
) -> Vec<String>
where
  F: Future + ToString,
```
"""]
answer.answer = """
```rust
async fn map_stringify<I, O, F>(
  inputs: Vec<I>, f: impl Fn(I) -> F, 
) -> Vec<String>
where
  O: ToString,
  F: Future<Output = O>,
```
"""
context = """
বর্ণিত function-টির একটি implementation এই:

```rust
async fn map_stringify<I, O, F>(
  f: impl Fn(I) -> F, inputs: Vec<I>
) -> Vec<String>
where
  O: ToString,
  F: Future<Output = O>,
{
  let f = &f;
  let futs = inputs
    .into_iter()
    .map(|input| async move { f(input).await.to_string() });
  futures::future::join_all(futs).await
}
```
"""
id = "b42a9c5b-bfe7-4d6f-967a-f8ff2a6faa0d"

