নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:** API-র compiler-এর type অনুমান ব্যবস্থার ওপর যত কম সম্ভব নির্ভর করা উচিত।
"""
prompt.distractors = ["3"]
prompt.sortAnswers = true
answer.answer = ["1", "2"]
context = """
function `F`-এর type নির্ধারণের বাইরে Option 1 আর 2-এ খুব বেশি type অনুমান লাগে না।

Option 3 একটি "marker" type-এর ওপর parameter-যুক্ত একটি `Register` trait তৈরি করে overloading-এর একটি কৌশল ব্যবহার করে।
এর দুটি register call মনে করুন:
```
events.register(|e: OnClick| { /* .. */ })
events.register(|_: Sequential, e: OnClick| { /* .. */ })
```

দেখে মনে হয় এরা একই implementation ব্যবহার করে, কিন্তু আসলে এরা একই method-এর ভিন্ন ভিন্ন implementation নির্দেশ করে।
প্রতিটি `.register(..)` call `Register`-এর কোন implementation-এর সঙ্গে মেলে তা নির্ধারণের সময় এই implementation
`Marker`-এর type অনুমানের জন্য compiler-এর ওপর নির্ভর করে। তাই আমাদের লক্ষ্য যদি type অনুমানের ওপর নির্ভর *না* করা হয়, তাহলে Option 3 অনুপযুক্ত।
