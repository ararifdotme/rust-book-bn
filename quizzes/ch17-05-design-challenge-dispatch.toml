[multipart]
q = """
**প্রেক্ষাপট:** আপনি একটি সরল event system নকশা করছেন, যা event-এর সাড়া হিসেবে callback function call করে। 

**কার্যক্ষমতা:** একটি `Events` struct callback নিবন্ধনের (register করার) function দেয়।
একটি callback হয় parallel-যোগ্য (একাধিক thread জুড়ে চালানো যায়), নয়তো ক্রমানুসারী (শুধু main thread-এ চালাতে হবে)।

**নকশা:** কার্যক্ষমতাটি implement করার জন্য নিচে কয়েকটি প্রস্তাবিত নকশা দেওয়া হলো।

```
pub struct Events {
	// ...
}

// Option 1: parallel and sequential are two separate methods
impl Events {
	pub fn register<E, F: Fn(E)>(&mut self, f: F) { /* .. */ }
	pub fn register_sequential<E, F: Fn(E)>(&mut self, f: F) { /* .. */ }
}

// Option 2: parallel and sequential are two members of an enum
pub enum Callback<F> {
	Parallel(F),
	Sequential(F)
}
impl Events {
	pub fn register<E, F: Fn(E)>(&mut self, f: Callback<F>) { /* .. */ }
}

// Option 3: parallel and sequential are markers in a trait method
pub trait Register<Marker, F, E> {
	fn register(&mut self, f: F);
}
pub struct Parallel;
pub struct Sequential;
impl<F, E> Register<Parallel, F, E> for Events 
where F: Fn(E) {
	fn register(&mut self, f: F) { /* .. */ }
}
impl<F, E> Register<Sequential, F, E> for Events 
where F: Fn(Sequential, E) {
	fn register(&mut self, f: F) { /* .. */ }
}
```
"""

[[questions]]
type = "MultipleChoice"
multipart = "q"
prompt.prompt = """
নিচের চাহিদা পূরণ করে এমন প্রতিটি নকশার বিকল্প বেছে নিন:

**চাহিদা:** default-ভাবে একটি callback-কে parallel-যোগ্য গণ্য করা উচিত, আর API-তে সেই default আচরণ প্রতিফলিত হওয়া উচিত।
"""
prompt.distractors = ["2"]
prompt.sortAnswers = true
answer.answer = ["1", "3"]
context = """
প্রথমে কল্পনা করি প্রতিটি নকশায় একটি callback register করা দেখতে কেমন হতো।

```rust
// Option 1
events.register(|e: OnClick| { /* .. */ });
events.register_sequential(|e: OnClick| { /* .. */ })

// Option 2
events.register(Callback::Parallel(|e: OnClick| { /* .. */ }));
events.register(Callback::Sequential(|e: OnClick| { /* .. */ }));

// Option 3
events.register(|e: OnClick| { /* .. */ });
events.register(|_: Sequential, e: OnClick| { /* .. */ });
```

এই বিকল্পগুলোর মধ্যে Option 1 আর 3 বোঝায় যে parallel-ই default mode, কারণ এটি সবচেয়ে সরল বিকল্পের সঙ্গে মেলে।
ক্রমানুসারী হতে হলে হয় একটি লম্বা method নাম (`_sequential`), নয়তো একটি marker type (`_: Sequential)` ব্যবহার করতে হয়।

Option 2 পরিষ্কারভাবে চিহ্নিত করে না যে parallel default হওয়া উচিত, কারণ `register`-এ `Parallel` আর `Sequential` দুটিই
পাঠাতে হয়।
