[[questions]]
id = "20846719-fe7b-48b8-abfd-9c5f1174472f"
type = "MultipleChoice"
prompt.prompt = """
নিচের গঠনের একটি workspace বিবেচনা করুন:

```
├── Cargo.lock
├── Cargo.toml
└── crates
    ├── a
    |   ├── lib.rs
    |   └── Cargo.toml
    └── b
        ├── lib.rs
        └── Cargo.toml
```

প্রতিটি ফাইলে এই বিষয়বস্তু আছে:

```
// crates/b/lib.rs
pub fn f() {}
```

```toml
# crates/a/Cargo.toml
[dependencies]
b = {path = "../b"}
```

`a/lib.rs`-এর ভেতরে `f` উল্লেখ করার সঠিক path নিচের কোনটি?
"""
answer.answer = "`b::f`"
prompt.distractors = [
    "`crates::b::f`",
    "`workspace::b::f`",
    "`super::b::f`",
]
context = """
`a`-এর দৃষ্টিকোণ থেকে `b` অন্য যেকোনো বাইরের crate-এর মতোই, তাই এর item ব্যবহার করতে কোনো prefix লাগে না।
"""

[[questions]]
id = "bc8a69b2-d9a8-4438-8657-391c3fda5ed9"
type = "ShortAnswer"
prompt.prompt = """
`a`, `b` ও `c` নামের তিনটি package-যুক্ত একটি workspace বিবেচনা করুন। তাদের নিজ নিজ manifest হলো:

```toml
# a/Cargo.toml
[dependencies]
rand = "0.8.4"

# b/Cargo.toml
[dependencies]
rand = "0.7.3"

# c/Cargo.toml
[dependencies]
rand = "0.8.5"
```

workspace-এর সব package compile করার সময় `rand`-এর কতগুলো ভিন্ন version ব্যবহৃত হবে? 
উত্তর একটি অঙ্ক হিসেবে লিখুন, যেমন 0, 1, ইত্যাদি।
"""
answer.answer = "2"
context = """
semantic versioning-এর নিয়ম অনুযায়ী `a` আর `c` দুটিই minor version `0.8`-এর সর্বশেষ patch ভাগ করে নেবে।
`b` ব্যবহার করবে minor version `0.7`-এর সর্বশেষ patch। তাই মোট দুটি version ব্যবহৃত হবে।
"""