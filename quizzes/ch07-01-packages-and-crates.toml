[[questions]]
id = "d45c7cbe-6089-40b9-843c-fbb9ff48ca49"
type = "ShortAnswer"
prompt.prompt = """
কল্পনা করুন, আপনি নিচের ফাইলগুলোসহ একটি Rust package `foobar` দেখছেন:

```text
foobar
├── Cargo.toml
├── build.rs
└── src/
    ├── main.rs
    ├── util.rs
    ├── lib.rs
    └── bin/
        └── alt.rs
```

এই package-এ কয়টি crate আছে? উত্তর একটি অঙ্ক হিসেবে লিখুন, যেমন 0, 1 ইত্যাদি।
"""
answer.answer = "3"
context = """ 
`main.rs` একটি binary crate তৈরি করে, `lib.rs` একটি library crate তৈরি করে, আর `bin/alt.rs` একটি binary crate তৈরি করে। `util.rs` সম্ভবত এই crate-গুলোর একটির ভেতরে
module হিসেবে ব্যবহার হবে, কিন্তু এটি Rust-এর চেনা কোনো বিশেষ ফাইলের নাম নয়, তাই এটি নিজে কোনো crate হবে না। `build.rs` হলো একটি build script।
"""
