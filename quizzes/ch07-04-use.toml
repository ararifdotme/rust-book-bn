[[questions]]
id = "eccc2099-9880-4628-8474-f1d55e2a4a4a"
type = "ShortAnswer"
prompt.prompt = """
এই module আর `use` statement দেখুন:

```
pub mod parent {
  pub fn a() {}
  fn b() {}
  pub mod child {
    pub fn c() {}
  }
}

fn main() {
  use parent::{*, child as alias};
  // ...
}
```

`main`-এর ভেতরে মোট কয়টি path `a`, `b` বা `c` উল্লেখ করতে পারে (`self`, `super` বা `crate` ব্যবহার করা path বাদে)?
উত্তর একটি অঙ্ক হিসেবে লিখুন, যেমন 0 বা 1। যেমন, শুধু `a` আর `parent::b` দুটি বৈধ path হলে উত্তর হতো 2।
"""
answer.answer = "5"
context = """
`a`-এর দুটি path আছে: `parent::a` আর `a`। `b`-এর কোনো path নেই, কারণ এটি private। `c`-এর তিনটি path আছে:
`parent::child::c`, `child::c`, `alias::c`।
"""