type = "MultipleChoice"
prompt.prompt = """
সত্য/মিথ্যা: এই কোডটি শেষ হবে (অর্থাৎ, এটি চিরকাল loop করবে না)।

```
fn main() {
    let mut x = 0;
    'a: loop {
        x += 1;
        'b: loop {
            if x > 10 {
                continue 'a;
            } else {
                break 'b;
            }      
        }
        break;       
    }
}
```
"""
answer.answer = "সত্য"
prompt.distractors = [ "মিথ্যা" ]
context = """
আসলে loop-এর প্রথম iteration-এর পরেই এটি শেষ হয়ে যাবে।
"""

