"""
answer.answer = "stack একটি নির্দিষ্ট function-এর সঙ্গে যুক্ত ডেটা রাখে, আর heap এমন ডেটা রাখে, যা একটি function-এর চেয়ে বেশিদিন টিকে থাকতে পারে"
prompt.distractors = [ 
  "stack heap-এ রাখা ডেটার pointer রাখতে পারে, আর heap শুধু pointer-ছাড়া ডেটা রাখে",
  "stack immutable ডেটা রাখে, আর heap mutable ডেটা রাখে।",
  "stack copyable ডেটা রাখে, আর heap non-copyable ডেটা রাখে।"
]
context = """
stack-এর frame-গুলো একটি নির্দিষ্ট function-এর সঙ্গে যুক্ত, আর function return করলে deallocate হয়।
heap-এর ডেটা অনির্দিষ্টকাল টিকে থাকতে পারে। লক্ষ করুন, stack আর heap দুই জায়গার ডেটাই mutable হতে পারে, copyable-ও হতে পারে। heap-এ
