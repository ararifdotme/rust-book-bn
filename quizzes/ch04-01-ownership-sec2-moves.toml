[[questions]]
id = "889ca9ac-0f4b-4abf-82c4-be9cd4d4f7ad"
type = "MultipleChoice"
prompt.prompt = "নিচের কোনটি এক ধরনের undefined behavior **নয়**?"
answer.answer = "একটি stack frame-এ free করা মেমোরির একটি pointer থাকা"
prompt.distractors = [
  "free করা মেমোরিকে নির্দেশ করে এমন pointer ব্যবহার করা",
  "একই মেমোরি দ্বিতীয়বার free করা",
  "boolean নয় এমন মানকে `if`-এর শর্ত হিসেবে ব্যবহার করা"
]
context = """
একটি stack frame-এ free করা মেমোরির pointer থাকা সম্পূর্ণ নিরাপদ হতে পারে। 
গুরুত্বপূর্ণ হলো সেই pointer আর *ব্যবহার* না করা, যেমন সেটি পড়া বা free করা।
"""

[[questions]]
id = "94425a4e-043e-47f8-9fba-c5b09fb60aa3"
type = "Tracing"
prompt.program = """
fn add_suffix(mut s: String) -> String {
  s.push_str(" world");
  s
}

fn main() {
  let s = String::from("hello");
  let s2 = add_suffix(s);
  println!("{}", s2);
}
"""
answer.doesCompile = true
answer.stdout = "hello world"
context = """
এই প্রোগ্রামটি বৈধ, কারণ `add_suffix`-এ move করার পর `s` আর ব্যবহার করা হয়নি।
"""

[[questions]]
id = "c00e3638-861b-4f9e-a55c-bfb67af79280"
type = "Tracing"
prompt.program = """
fn main() {
  let s = String::from("hello");
  let s2;
  let b = false;
  if b {
    s2 = s;
  }
  println!("{}", s);
}
"""
answer.doesCompile = false
answer.lineNumber = 8
context = """
যেহেতু if-statement-এর ভেতরে `s` move হতে পারে, তাই লাইন 8-এ এটি ব্যবহার করা অবৈধ।
`b` সবসময় `false` বলে এই প্রোগ্রামে if-statement কখনো চলবে না ঠিকই,
কিন্তু Rust সাধারণত if-statement চলবে কি না, তা নির্ধারণের চেষ্টা করে না। Rust শুধু
ধরে নেয় যে এটি চলতে *পারে*, আর তাই `s` move হতে *পারে*।
"""

[[questions]]
id = "f7d67c11-60bb-4d92-8cc2-8ce82cf4c974"
type = "MultipleChoice"
prompt.prompt = """
ধরুন আমাদের কাছে একটি box move করে এমন একটি function আছে, এরকম:
```
fn move_a_box(b: Box<i32>) {
  // This space intentionally left blank
}
```

নিচে চারটি কোড-অংশ আছে, যেগুলো Rust compiler বাতিল করে দেয়। 
কল্পনা করুন, Rust এর বদলে এই কোড-অংশগুলোকে compile হতে ও চলতে দিল। 
যে কোড-অংশগুলো undefined behavior ঘটাবে, সেগুলোর প্রতিটি বেছে নিন, অথবা কোনোটিই 
undefined behavior না ঘটালে "এগুলোর কোনোটিই নয়" বেছে নিন।
"""
answer.answer = [
"""
```
let b = Box::new(0);
let b2 = b;
move_a_box(b);
```
""",
"""
```
let b = Box::new(0);
move_a_box(b);
println!("{}", b);
```
""",
"""
```
let b = Box::new(0);
move_a_box(b);
let b2 = b;
```
"""
]
prompt.distractors = [
"""
```
let b = Box::new(0);
let b2 = b;
println!("{}", b);
move_a_box(b2);
```
""",
"এগুলোর কোনোটিই নয়"
]
context = """
মূল কথা হলো, একটি box `move_a_box`-এ পাঠানো হলে `move_a_box` শেষ হওয়ার পর তার মেমোরি deallocate হয়।
তাই:
* `move_a_box`-এর পর `println` দিয়ে `b` পড়া undefined behavior, কারণ এটি free করা মেমোরি পড়ে।
* `b`-কে দ্বিতীয় একটি owner দেওয়া undefined behavior, কারণ এর ফলে Rust `b2`-এর হয়ে box-টি দ্বিতীয়বার free করবে। `let b2 = b` binding
  `move_a_box`-এর আগে হলো নাকি পরে, তাতে কিছু যায় আসে না।

তবে `let b2 = b` করে তারপর `println` করা undefined behavior নয়। `b` move হলেও শেষে `move_a_box` call না হওয়া পর্যন্ত এর ডেটা deallocate হয় না। তাই 
এই প্রোগ্রামটি প্রযুক্তিগতভাবে নিরাপদ, যদিও Rust তবু এটিকে বাতিল করে।
"""
