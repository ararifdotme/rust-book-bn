type = "MultipleChoice"
prompt.prompt = """
কিছু concurrency API-তে mutex তার পাহারা দেওয়া ডেটা থেকে আলাদা থাকে। যেমন, এমন একটি কাল্পনিক Mutex API কল্পনা করুন:

```
let mut data = Vec::new();
let mx: Mutex = Mutex::new();
{
    let _guard = mx.lock();
    data.push(0);
}
```

Rust কেন শুধু `Mutex`-এর বদলে `Mutex<T>` ব্যবহার করে, তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "mutex lock না করে mutex-এর ডেটায় প্রবেশ ঠেকাতে"
prompt.distractors = [
    "mutex-এর method কম call করতে হয় তার জন্য",
    "mutex-যুক্ত concurrent প্রোগ্রামের দক্ষতা বাড়াতে",
    "mutex-এর ডেটা thread-এর মধ্যে সরানো ঠেকাতে"
]
context = """
`Mutex<T>`-এর নকশা নিশ্চিত করে যে mutex lock থাকা অবস্থাতেই কেবল এর ডেটায় প্রবেশ করা যায়, আর উল্টোভাবে,
ডেটায় আর প্রবেশ করা না গেলেই mutex unlock হয়ে যায়।
"""

