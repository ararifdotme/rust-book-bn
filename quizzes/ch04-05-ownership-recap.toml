id = "868a4edf-16f0-4191-8aed-835c812b8b25"
type = "MultipleChoice"
prompt.prompt = """
Rust সাধারণত একই array-তে একাধিক mutable প্রবেশাধিকার নিষিদ্ধ করে, এমনকি সেই প্রবেশাধিকারগুলো পরস্পর-বিচ্ছিন্ন হলেও। 
যেমন, এই function compile হয় না:

```
fn main() {
  let mut v = vec![0, 1, 2, 3];
  let (r0, r1) = (&mut v[0..2], &mut v[2..4]);
  r0[0] += 1;
  r1[0] += 1;  
}
```

তবে Rust-এর standard library-তে `slice::split_at_mut` নামে একটি function আছে, যা এই কাজের অনুমতি দেয়:

```
fn main() {
  let mut v = vec![0, 1, 2, 3];
  let (r0, r1) = v.split_at_mut(2);
  r0[0] += 1;
  r1[0] += 1;  
}
```

`split_at_mut` কীভাবে implement করা সম্ভব, তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "`split_at_mut` unsafe কোড ব্যবহার করে raw pointer দিয়ে borrow checker-কে পাশ কাটায়"
prompt.distractors = [
"`split_at_mut` compiler-এর একটি বিশেষ মৌলিক উপাদান, যা ভাষার ভেতরে implement করা যায় না",
"`split_at_mut` unsafe কোড ব্যবহার করে borrow checker-এর mutable reference-এর নিরাপত্তা যাচাই বন্ধ করে দেয়",
"`split_at_mut` এমন একটি C library call করে, যা Rust বিশ্লেষণ করতে পারে না"
]
context = """
[অধ্যায় 4.3 "একটি নিরাপদ প্রোগ্রাম ঠিক করা: array-র আলাদা উপাদান mutate করা"](ch04-03-fixing-ownership-errors.html#fixing-a-safe-program-mutating-different-array-elements)-এ যেমন আলোচনা করা হয়েছে, `split_at_mut`-এর মতো function implement করা হয় `unsafe` বৈশিষ্ট্য দিয়ে।
এই বৈশিষ্ট্য borrow checker-কে পুরোপুরি বন্ধ করে না, বরং raw pointer-এর মতো নির্দিষ্ট কিছু অনিরাপদ বৈশিষ্ট্য ব্যবহারের সুযোগ দেয়।
"""


