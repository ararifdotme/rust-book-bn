[[questions]]
type = "MultipleChoice"
prompt.prompt = "একটি future `f` দেওয়া থাকলে, `f.await` কীভাবে কাজ করে তা নিচের কোনটি সবচেয়ে ভালোভাবে বর্ণনা করে?"
prompt.distractors = [
  "এটি একবার `f.poll()` call করে, যা `f` প্রস্তুত না হওয়া পর্যন্ত জায়গাতেই block করে",
  "এটি একটি loop-এ `f.poll()` call করে, `f` প্রস্তুত হলে বেরিয়ে যায়, আর `f` প্রস্তুত না হলে সঙ্গে সঙ্গে আবার poll করে",
  "এটি একবার `f.push(...)` call করে, যা `f` প্রস্তুত হলে `f.await`-এর পরের বাকি কোডযুক্ত একটি callback চালায়"
]
answer.answer = "এটি একটি loop-এ `f.poll()` call করে, `f` প্রস্তুত হলে বেরিয়ে যায়, আর `f` প্রস্তুত না হলে async runtime-এর হাতে নিয়ন্ত্রণ ফিরিয়ে দেয়"
context = """
future চালাতে Rust poll-ভিত্তিক একটি model ব্যবহার করে। একটি await point এমন একটি loop-এ পরিণত হয়, যা বারবার `.poll()` call করে, 
এবং প্রতিটি ব্যর্থ poll-এর পর অন্য async কোড চলতে দিতে async runtime-এর হাতে নিয়ন্ত্রণ ছেড়ে দেয়। runtime পরে
`f` আবার poll করতে `f.await` কোডকে "জাগিয়ে তুলতে" পারে।
"""
id = "c4d90f3c-7286-4272-921c-241b266e9f91"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
কল্পনা করুন, poll করার জন্য Rust future-কে pin করা বাধ্যতামূলক করত না। 
নিচের কোন async function pin না করলে undefined behavior ঘটাতে পারে?
"""
prompt.distractors = [
"""
```rust
async fn example(x: &i32) -> i32 {
    sleep(Duration::from_secs(1)).await;
    *y
}
```
""",
"""
```rust
async fn example(x: Vec<i32>) -> i32 {
    sleep(Duration::from_secs(1)).await;
    x[0]
}
```
""",
"""
```rust
async fn example() -> i32 {
    let x = 0;
    sleep(Duration::from_secs(1)).await;
    x
}
```
""",  
]
answer.answer = """
```rust
async fn example(x: i32) -> i32 {
    let y = &x;
    sleep(Duration::from_secs(1)).await;
    *y
}
```
"""
context = """
pinning যে মূল সমস্যার সমাধান করে তা হলো নিজেকেই reference করা, অর্থাৎ এমন একটি future যাতে নিজেরই দিকে একটি pointer থাকে। 
এটি ঘটে যখন একটি async block-এ এমন একটি local variable থাকে, যা future-এর আরেকটি local variable-কে নির্দেশ করে।
এখানে সেটি হলো `y = &x`।
"""
id = "bc8b4acb-d111-4fec-b89a-e5d1bc77c8f2"
