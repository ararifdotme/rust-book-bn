[[questions]]
type = "MultipleChoice"
prompt.prompt = """
নিচের async function-টির সহজ রূপ (desugar করা রূপ) কোন type signature?

```rust
async fn calculate(nums: &[i32]) -> i32 {
  /* ... */
}
```
"""
prompt.distractors = [
  """
```rust
fn calculate<'a>(nums: &'a [i32], output: &mut impl Future<Output = i32> + 'a);
```
  """,
  """
```rust
fn calculate(nums: &'_ [i32]) -> i32 as Future;
```
  """,
  """
```rust
fn calculate() -> impl for<'a> Future<Input = &'a [i32], Output = i32> + 'a;
```
  """
]
answer.answer = """
```rust
fn calculate<'a>(nums: &'a [i32]) -> impl Future<Output = i32> + 'a;
```
"""
context = """
একটি async function এমন একটি নামহীন type return করে, যা `Future` trait implement করে এবং যার output হলো function-এর return type। 
তাই এখানে তা প্রকাশ করা হয় `impl Future<Output = i32>` হিসেবে। future-টি function-এর argument-গুলোর সব lifetime capture করে।
তাই return করা type-এ `+ 'a` bound থাকে, আর input slice-এর type হয় `&'a [i32]`। এটি বোঝায় যে slice-টিকে 
অন্তত সেই future-এর সমান সময় বাঁচতে হবে, যা একে capture করে।
"""
id = "9c000322-464b-4d34-9e30-55591f9283d2"
