id = "d070eb9e-4527-453a-8c9b-698739a3dd6a"
type = "MultipleChoice"
prompt.prompt = """
**প্রোগ্রাম 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

নিচের সমাধানগুলোর (হলুদ রঙে হাইলাইট করা) মধ্যে কোনটি এই তিনটি শর্ত সবচেয়ে ভালোভাবে পূরণ করে:
1. ঠিক করা function-টি Rust compiler পেরিয়ে যায়,
2. ঠিক করা function-টি মূল কোডের উদ্দেশ্য বজায় রাখে, এবং
3. ঠিক করা function-টি অপ্রয়োজনীয় অদক্ষতা যোগ করে না
"""
answer.answer = """
```ide
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    `[let mut elem_refs: Vec<&T> = elems.iter().collect();]`
    `[elem_refs.sort();]`
    let t = `[elem_refs[n]]`;
    return t.clone();
}
```
"""
prompt.distractors = [
"""
```ide
fn find_nth<T: Ord + Clone>(`[elems: &mut [T]]`, n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```
""",
"""
```ide
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    `[let mut elems = elems.to_vec();]`
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```
""",
"""
```ide
fn find_nth<`[T: Ord]`>(`[mut elems: Vec<T>]`, n: usize) -> T {
    elems.sort();
    let t = `[elems.remove(n)]`;
    return `[t]`;
}
```
""",
]
context = """
`find_nth`-এর মতো একটি function স্পষ্টতই শুধু-পড়ার (read-only) function হিসেবে তৈরি, অর্থাৎ
input sequence-এর কোনো বৈশিষ্ট্য বের করার জন্য। তাই যে সমাধান input পরিবর্তন বা drop করে, তা মূল function-এর উদ্দেশ্য বজায় রাখে না, যদিও
সেটি একটি সহায়ক vector তৈরির চেয়ে বেশি দক্ষ হতে পারে। 

`Vec<T>` তৈরির চেয়ে `Vec<&T>` তৈরি করা ভালো, কারণ `T` বড় হলে
`elems.to_vec()` ব্যয়বহুল হতে পারে। তবে যদি জানতাম যে `T: Copy`, তাহলে `elems.sort()`-এর ভেতরে pointer dereference-এর
সংখ্যা কমাতে `to_vec`-ই ভালো হতো।
"""

