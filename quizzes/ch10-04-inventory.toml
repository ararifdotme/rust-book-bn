id = "95979d75-5823-4059-a1cf-7e0eba69b41a"
type = "MultipleChoice"
prompt.prompt = """
**প্রোগ্রাম 2:**

```ide
struct TestResult {
    /// Student's scores on a test
    scores: Vec<usize>,

    /// A possible value to curve all scores
    curve: Option<usize>
}
impl TestResult {  
    pub fn get_curve(&self) -> &Option<usize> { 
        &self.curve 
    }

    /// If there is a curve, then increments all 
    /// scores by the curve
    pub fn apply_curve(&mut self) {
        if let Some(curve) = self.get_curve() {
            for score in self.scores.iter_mut() {
                *score += *curve;
            }
        }
    }
}
```

এই প্রোগ্রাম compile করার চেষ্টা করলে আপনি যে compiler error পেতেন, নিচের কোনটি তা সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "in `apply_curve`, cannot borrow `self.scores` as mutable for `iter_mut`"
prompt.distractors = [
  "in `get_curve`, cannot return a reference to a local variable `self.curve`",
  "in `apply_curve`, cannot borrow `self` as immutable for `get_curve`",
  "in `apply_curve`, `*score` cannot be mutated"
]
context = """
lifetime elision-এর কারণে `get_curve` function-এর type signature হলো `get_curve<'a>(&'a self) -> &'a Option<usize>`। 
এর মানে `self.get_curve()` call করলে borrow শুধু `self.curve`-এর ওপর নয়, পুরো `self`-এর ওপর বিস্তৃত হয়।
তাই `let Some(curve) = ...`-এর scope-এর ভেতরে `self` immutable-ভাবে borrow করা থাকে, আর `self.scores.iter_mut()`
call করা যায় না।
"""


