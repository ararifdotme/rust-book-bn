**প্রোগ্রাম 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

এই প্রোগ্রাম compile করার চেষ্টা করলে আপনি যে compiler error পেতেন, নিচের কোনটি তা সবচেয়ে ভালোভাবে বর্ণনা করে?
"""
answer.answer = "cannot borrow `elems` as mutable for `sort`"
prompt.distractors = [
  "cannot move out of shared reference for `clone`",
  "cannot move out of shared reference in expression `&elems[n]`",
  "the lifetime of `T` must outlive `&[T]`",
]
context = """
`slice::sort` method একটি slice-এর mutable reference আশা করে, কিন্তু
তার বদলে একটি immutable reference পায়।
"""


