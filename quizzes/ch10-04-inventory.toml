id = "3ee8d846-d282-4de1-8e83-5ca0bc44fc13"
type = "MultipleChoice"
prompt.prompt = """
**প্রোগ্রাম 1:**

```ide
/// Returns the n-th largest element in a slice
fn find_nth<T: Ord + Clone>(elems: &[T], n: usize) -> T {
    elems.sort();
    let t = &elems[n];
    return t.clone();
}
```

সাধারণত এই function compile করার চেষ্টা করলে compiler নিচের error দেয়:

```text
error[E0596]: cannot borrow `*elems` as mutable, as it is behind a `&` reference
 --> test.rs:3:5
  |
3 |     elems.sort();
  |     ^^^^^^^^^^^^ `elems` is a `&` reference, so the data it refers to cannot be borrowed as mutable
```

ধরে নিন, compiler এই function বাতিল **করেনি**। নিচের প্রোগ্রামগুলোর মধ্যে কোনগুলো (যদি থাকে)
(1) compiler পেরিয়ে যাবে, এবং (2) চালালে undefined behavior ঘটাতে পারে?
দুটি শর্তই পূরণ করে এমন প্রতিটি প্রোগ্রাম বেছে নিন, অথবা কোনোটিই পূরণ না করলে "এগুলোর কোনোটিই নয়" বেছে নিন।
"""
answer.answer = ["এগুলোর কোনোটিই নয়"]
prompt.distractors = [
"""
```
let v = vec![5, 4, 3, 2, 1];
find_nth(&v, 10);
```
""",
"""
```
let v = vec![5, 4, 3, 2, 1];
find_nth(&v, 0);
println!("{}", v[0]);
```
""",
"""
```
let v = vec![5, 4, 3, 2, 1];
let n = &v[0];
find_nth(&v, 0);
println!("{}", n);
```
""",
]
context = """
এই প্রোগ্রাম কারিগরি দিক থেকে memory-safe, কারণ `slice::sort` শুধু উপাদানগুলোর জায়গা বদলাতে পারে,
এগুলোকে মুক্ত করতে পারে না। যেমন, `find_nth` call করার পর `&v[0]` নিশ্চিতভাবে 
*কোনো একটি* সংখ্যাকে নির্দেশ করবে, যদিও সেটি *মূল* সংখ্যাটি না-ও হতে পারে।

খেয়াল করুন, `find_nth(&v, 10)` undefined behavior ঘটায় না, কারণ Rust array-তে প্রবেশের সময় যাচাই
করে, তাই `&v[10]` মূল্যায়ন করলে panic হবে।
"""


