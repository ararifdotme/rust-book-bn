id = "8c80f9e8-2d95-43cc-9aa4-04d617dd8cb9"
type = "Tracing"
prompt.program = """
macro_rules! manylet {
    ( $( $i:ident ),* = $e:expr ) => {
        $(
            let mut $i = $e;
        )*
    }
}

fn main() {
    let mut s = String::from("A");
    manylet!(x, y = s);
    x.push_str("B");
    println!("{x}{y}");
}
"""
answer.doesCompile = false
answer.lineNumber = 11
context = """
`manylet` macro সমান চিহ্নের বাম পাশের প্রতিটি variable-এর binding হিসেবে
`e` expression-টিকে syntax-গতভাবে নকল করে। কিন্তু `s` যেহেতু একটি owned string, 
তাই `x`-এর প্রথম binding `s`-কে সরিয়ে নেয়, আর `y`-এর দ্বিতীয় binding অবৈধ।
"""

